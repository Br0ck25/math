<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <pattern id="gingham" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#FFFFFF" opacity="0.6"/>
      <rect x="4" y="4" width="4" height="4" fill="#FFFFFF" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Braids (behind) -->
  <g fill="#92400E" stroke="#451A03" stroke-width="2.5">
    <circle cx="20" cy="56" r="6.5"/>
    <circle cx="19" cy="68" r="6"/>
    <circle cx="19" cy="79" r="5.2"/>
    <circle cx="80" cy="56" r="6.5"/>
    <circle cx="81" cy="68" r="6"/>
    <circle cx="81" cy="79" r="5.2"/>
  </g>
  <!-- Red Hair Ribbons -->
  <path d="M 12 84 L 19 87 L 26 84 L 26 92 L 19 89 L 12 92 Z" fill="#EF4444" stroke="#991B1B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 74 84 L 81 87 L 88 84 L 88 92 L 81 89 L 74 92 Z" fill="#EF4444" stroke="#991B1B" stroke-width="2" stroke-linejoin="round"/>

  <!-- Blue Gingham Dress (Shoulders) -->
  <path d="M 24 94 C 26 78 36 72 50 72 C 64 72 74 78 76 94 Z" fill="#60A5FA" stroke="#1E3A8A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 24 94 C 26 78 36 72 50 72 C 64 72 74 78 76 94 Z" fill="url(#gingham)"/>

  <!-- White Collar -->
  <path d="M 36 73 Q 50 84 64 73 L 60 69 Q 50 76 40 69 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Hair (behind face) -->
  <ellipse cx="50" cy="42" rx="28" ry="27" fill="#92400E" stroke="#451A03" stroke-width="3"/>

  <!-- Face -->
  <ellipse cx="50" cy="49" rx="19" ry="21" fill="#FDDCC0" stroke="#5B3A29" stroke-width="3"/>

  <!-- Centre-Parted Fringe -->
  <path d="M 31 44 C 32 26 50 22 50 22 C 50 22 68 26 69 44 C 62 36 54 34 50 26 C 46 34 38 36 31 44 Z" fill="#92400E" stroke="#451A03" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Brown Eyes -->
  <ellipse cx="41" cy="50" rx="4.8" ry="5.8" fill="#FFFFFF" stroke="#5B3A29" stroke-width="2"/>
  <circle cx="41.4" cy="51" r="3.2" fill="#78350F"/>
  <circle cx="41.4" cy="51" r="1.7" fill="#1E293B"/>
  <circle cx="40" cy="49" r="1" fill="#FFFFFF"/>
  <ellipse cx="59" cy="50" rx="4.8" ry="5.8" fill="#FFFFFF" stroke="#5B3A29" stroke-width="2"/>
  <circle cx="58.6" cy="51" r="3.2" fill="#78350F"/>
  <circle cx="58.6" cy="51" r="1.7" fill="#1E293B"/>
  <circle cx="57.2" cy="49" r="1" fill="#FFFFFF"/>

  <!-- Brows, Cheeks, Nose and Hopeful Smile -->
  <path d="M 35 43 Q 41 40 47 43" fill="none" stroke="#78350F" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 65 43 Q 59 40 53 43" fill="none" stroke="#78350F" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="33" cy="61" r="3.6" fill="#FB7185" opacity="0.4"/>
  <circle cx="67" cy="61" r="3.6" fill="#FB7185" opacity="0.4"/>
  <path d="M 50 55 Q 52 59 49 59" fill="none" stroke="#C9926A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 43 65 Q 50 71 57 65" fill="none" stroke="#9F1239" stroke-width="2.2" stroke-linecap="round"/>
</svg>

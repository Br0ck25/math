<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />

  <!-- Chestnut Brown Braided Pigtails (Back Silhouette) -->
  <path d="
    M 20 44 
    C 10 26 16 12 34 8 
    C 44 6 56 6 66 8 
    C 84 12 90 26 80 44 
    C 88 58 86 76 80 84 
    L 20 84 
    C 14 76 12 58 20 44 
    Z" fill="#78350F" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Left Twin Braid Loops with Sky Blue Ribbon -->
  <ellipse cx="14" cy="62" rx="4.5" ry="7" transform="rotate(-15 14 62)" fill="#92400E" stroke="#1E293B" stroke-width="2" />
  <!-- Left Sky-Blue Ribbon Bow -->
  <ellipse cx="15" cy="53" rx="3.5" ry="2" transform="rotate(-20 15 53)" fill="#38BDF8" stroke="#0284C7" stroke-width="1.2" />
  <circle cx="15" cy="53" r="1.3" fill="#0284C7" />

  <!-- Right Twin Braid Loops with Sky Blue Ribbon -->
  <ellipse cx="86" cy="62" rx="4.5" ry="7" transform="rotate(15 86 62)" fill="#92400E" stroke="#1E293B" stroke-width="2" />
  <!-- Right Sky-Blue Ribbon Bow -->
  <ellipse cx="85" cy="53" rx="3.5" ry="2" transform="rotate(20 85 53)" fill="#38BDF8" stroke="#0284C7" stroke-width="1.2" />
  <circle cx="85" cy="53" r="1.3" fill="#0284C7" />

  <!-- Main Head Squircle Base (Fair Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Soft Wavy Center-Parted Bangs -->
  <path d="
    M 21 34 
    Q 32 40 44 28 
    Q 48 35 50 26 
    Q 52 35 56 28 
    Q 68 40 79 34 
    L 79 24 
    Q 50 12 21 24 
    Z" fill="#78350F" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Warm Auburn Hair Highlights -->
  <path d="M 33 13 Q 38 22 34 27" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" />
  <path d="M 63 13 Q 59 22 64 27" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" />

  <!-- Expressive Soft Arched Eyebrows -->
  <path d="M 28 38 Q 36 32 44 37" fill="none" stroke="#451A03" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 56 37 Q 64 32 72 38" fill="none" stroke="#451A03" stroke-width="2.6" stroke-linecap="round" />

  <!-- Eyelashes -->
  <!-- Left Eye Lashes -->
  <path d="M 28 43 Q 37 39 45 43" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="28" y1="43" x2="25" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="33" y1="41" x2="31" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Right Eye Lashes -->
  <path d="M 55 43 Q 63 39 72 43" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="72" y1="43" x2="75" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="67" y1="41" x2="69" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Big Curious Warm Brown Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="4.4" fill="#5A3319" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="36.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="39.8" cy="49.5" r="0.7" fill="#92400E" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="48" r="4.4" fill="#5A3319" />
  <circle cx="61.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="59.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="62.8" cy="49.5" r="0.7" fill="#92400E" />

  <!-- Cute Dainty Nose -->
  <path d="M 48 56 Q 50 59 53 57" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

  <!-- Rosy Cheerful Cheeks -->
  <circle cx="28" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />
  <circle cx="72" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />

  <!-- Innocent Sweet Smile -->
  <path d="M 39 67 Q 50 74 61 67" fill="none" stroke="#E11D48" stroke-width="2.6" stroke-linecap="round" />

  <!-- Blue Gingham Pinafore & White Blouse Collar Base -->
  <g>
    <!-- White High-Neck Blouse Base -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#F8FAFC" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Left Blue Gingham Pinafore Strap -->
    <path d="M 32 80 L 37 80 L 40 88 L 34 88 Z" fill="#38BDF8" stroke="#1E293B" stroke-width="1.4" />
    <path d="M 34 80 L 34 88 M 32 84 L 38 84" stroke="#0284C7" stroke-width="1" />

    <!-- Right Blue Gingham Pinafore Strap -->
    <path d="M 68 80 L 63 80 L 60 88 L 66 88 Z" fill="#38BDF8" stroke="#1E293B" stroke-width="1.4" />
    <path d="M 64 80 L 64 88 M 62 84 L 68 84" stroke="#0284C7" stroke-width="1" />

    <!-- White Peter Pan Blouse Collar Line -->
    <path d="M 42 80 Q 50 83 58 80" fill="none" stroke="#CBD5E1" stroke-width="1.4" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pointed Hippogriff Feather Tufts / Ears -->
  <!-- Left Ear Tuft -->
  <polygon points="26,34 14,14 36,22" fill="#64748B" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
  <polygon points="25,30 19,18 32,23" fill="#CBD5E1" />

  <!-- Right Ear Tuft -->
  <polygon points="74,34 86,14 64,22" fill="#64748B" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
  <polygon points="75,30 81,18 68,23" fill="#CBD5E1" />

  <!-- Scruffy Crown Feather Crest Plumes -->
  <polygon points="42,20 46,9 50,18" fill="#64748B" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="50,18 54,9 58,20" fill="#64748B" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Hippogriff Neck Base (Feathered Steel Slate) -->
  <path d="M 38 78 L 34 88 L 66 88 L 62 78 Z" fill="#475569" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
  <!-- Feather Collar Ridge -->
  <path d="M 34 84 Q 50 89 66 84 L 64 88 Q 50 93 36 88 Z" fill="#94A3B8" stroke="#0F172A" stroke-width="1.8" />

  <!-- Main Head Squircle Base (Steel Gray Feather Coat) -->
  <rect x="22" y="24" width="56" height="54" rx="20" fill="#64748B" stroke="#0F172A" stroke-width="3.5" />

  <!-- Lighter Gray Cheek Feather Tufts / Ruff -->
  <polygon points="22,46 12,52 22,58" fill="#CBD5E1" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="78,46 88,52 78,58" fill="#CBD5E1" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Lower Face / Light Silver Feather Mask -->
  <path d="M 22 52 C 22 72 34 78 50 78 C 66 78 78 72 78 52 C 78 42 68 46 50 48 C 32 46 22 42 22 52 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Proud / Piercing Raptor Eyebrow Ridges -->
  <path d="M 30 36 Q 38 31 46 37" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 70 36 Q 62 31 54 37" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" />

  <!-- Fierce Orange / Amber Raptor Eyes -->
  <!-- Left Eye -->
  <ellipse cx="38" cy="44" rx="7.5" ry="9" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
  <ellipse cx="39" cy="44" rx="5.2" ry="6.8" fill="#F97316" />
  <circle cx="39.5" cy="44" r="3" fill="#0F172A" />
  <circle cx="38" cy="42" r="1.1" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="62" cy="44" rx="7.5" ry="9" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
  <ellipse cx="61" cy="44" rx="5.2" ry="6.8" fill="#F97316" />
  <circle cx="60.5" cy="44" r="3" fill="#0F172A" />
  <circle cx="59" cy="42" r="1.1" fill="#FFFFFF" />

  <!-- Large Sharp Eagle Beak (Gunmetal / Dark Slate) -->
  <path d="M 40 52 C 40 50 45 49 50 49 C 55 49 60 50 60 52 C 60 62 57 71 50 75 C 43 71 40 62 40 52 Z" fill="#334155" stroke="#0F172A" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Hooked Beak Curved Cut & Highlight -->
  <path d="M 48 53 L 45 56" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" />
  <line x1="50" y1="56" x2="50" y2="70" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />

  <!-- Lower Hook Lip Undercurve -->
  <path d="M 44 68 Q 50 74 56 68" fill="#1E293B" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears & Pearl Stud Earrings -->
  <!-- Left Ear -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <circle cx="19" cy="55" r="2.4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- Right Ear -->
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <circle cx="81" cy="55" r="2.4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- High Ballerina Chignon / Bun -->
  <ellipse cx="50" cy="11" rx="15" ry="9.5" fill="#FACC15" stroke="#1E293B" stroke-width="3" stroke-linejoin="round" />
  <ellipse cx="50" cy="11" rx="9.5" ry="5.5" fill="#FDE047" />

  <!-- Iconic Powder-Blue Headband / Tiara Band -->
  <path d="M 23 27 C 23 11 77 11 77 27 L 74 31 C 74 16 26 16 26 31 Z" fill="#93C5FD" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Classic Strawberry-Blonde Hair (Back Silhouette) -->
  <path d="
    M 20 44 
    C 10 26 16 12 34 8 
    C 44 6 56 6 66 8 
    C 84 12 90 26 80 44 
    C 88 58 86 76 80 84 
    L 20 84 
    C 14 76 12 58 20 44 
    Z" fill="#FACC15" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Fair Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Sweeping Front Bangs / Curled Fringe -->
  <path d="
    M 21 34 
    Q 32 40 44 28 
    Q 50 36 54 26 
    Q 62 38 72 26 
    Q 76 36 79 32 
    L 79 24 
    Q 50 12 21 24 

  <!-- Hair Texture & Highlights -->
  <path d="M 34 13 Q 39 23 35 28" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />
  <path d="M 64 13 Q 60 23 65 28" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />

  <!-- Elegant Soft-Brown Arched Eyebrows -->
  <path d="M 28 38 Q 36 32 44 37" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 56 37 Q 64 32 72 38" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" />

  <!-- Eyelashes & Upper Lid Line -->
  <!-- Left Eye Lashes -->
  <path d="M 28 43 Q 37 39 45 43" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="28" y1="43" x2="25" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="33" y1="41" x2="31" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Right Eye Lashes -->
  <path d="M 55 43 Q 63 39 72 43" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="72" y1="43" x2="75" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="67" y1="41" x2="69" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Sparkling Sapphire / Cornflower Blue Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="4.4" fill="#3B82F6" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="36.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="39.8" cy="49.5" r="0.7" fill="#93C5FD" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="48" r="4.4" fill="#3B82F6" />
  <circle cx="61.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="59.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="62.8" cy="49.5" r="0.7" fill="#93C5FD" />

  <!-- Delicate Button Nose -->
  <path d="M 48 56 Q 50 59 53 57" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

  <!-- Soft Gentle Blush -->
  <circle cx="28" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />
  <circle cx="72" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />

  <!-- Graceful Pink Lip Smile -->
  <path d="M 39 67 Q 50 74 61 67" fill="none" stroke="#E11D48" stroke-width="2.6" stroke-linecap="round" />

  <!-- Black Velvet Choker & Silver-Blue Gown Collar Base -->
  <g>
    <!-- Black Velvet Choker Ribbon -->
    <path d="M 32 75 Q 50 79 68 75 L 68 79 Q 50 83 32 79 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
    <!-- Choker Pendant Gem -->
    <circle cx="50" cy="79" r="1.6" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8" />

    <!-- Shimmering Gown Neckline Fold -->
    <path d="M 26 81 Q 50 87 74 81 L 74 88 Q 50 94 26 88 Z" fill="#BFDBFE" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- White Organza Puff Accents -->
    <ellipse cx="28" cy="85" rx="5" ry="3.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <ellipse cx="72" cy="85" rx="5" ry="3.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
  </g>
</svg>
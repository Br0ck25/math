<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Twig Hair / Branches on Head -->
  <!-- Left Twig -->
  <path d="M 46 22 L 40 10 L 34 8 M 40 10 L 41 4" fill="none" stroke="#5A3319" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Center Main Twig -->
  <path d="M 50 22 L 50 8 L 47 4" fill="none" stroke="#5A3319" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Twig -->
  <path d="M 54 22 L 60 10 L 66 7 M 60 10 L 59 4" fill="none" stroke="#5A3319" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Neck Snow Foundation Base -->
  <path d="M 34 80 Q 50 86 66 80 L 66 88 Q 50 94 34 88 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Olaf Snow White Head) -->
  <rect x="22" y="22" width="56" height="60" rx="20" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5" />

  <!-- Cheerful Raised Twig / Charcoal Eyebrows -->
  <path d="M 28 35 Q 36 29 44 34" fill="none" stroke="#5A3319" stroke-width="3.2" stroke-linecap="round" />
  <path d="M 56 34 Q 64 29 72 35" fill="none" stroke="#5A3319" stroke-width="3.2" stroke-linecap="round" />

  <!-- Large Cartoon Eyes with Slate Shading -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="45" rx="8" ry="8.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.4" />
  <circle cx="39" cy="45" r="4.2" fill="#0F172A" />
  <circle cx="37.5" cy="42.8" r="1.3" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="45" rx="8" ry="8.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.4" />
  <circle cx="61" cy="45" r="4.2" fill="#0F172A" />
  <circle cx="59.5" cy="42.8" r="1.3" fill="#FFFFFF" />

  <!-- Big Carrot Nose (Forward-Facing Bulbous Carrot) -->
  <path d="
    M 44 51 
    C 44 48 47 47 50 47 
    C 53 47 56 48 56 51 
    C 58 56 57 63 50 65 
    C 43 63 42 56 44 51 
    Z" fill="#EA580C" stroke="#7C2D12" stroke-width="2.4" stroke-linejoin="round" />
  <!-- Carrot Ridges / Segments -->
  <path d="M 45 52 Q 50 54 55 52" fill="none" stroke="#C2410C" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 46 56 Q 50 58 54 56" fill="none" stroke="#C2410C" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 47 60 Q 50 62 53 60" fill="none" stroke="#C2410C" stroke-width="1.4" stroke-linecap="round" />

  <!-- Rosy Snow Shading / Flush -->
  <circle cx="28" cy="58" r="4" fill="#93C5FD" opacity="0.4" />
  <circle cx="72" cy="58" r="4" fill="#93C5FD" opacity="0.4" />

  <!-- Wide Open Happy Mouth -->
  <path d="M 32 64 Q 50 82 68 64 Q 50 70 32 64 Z" fill="#1E293B" stroke="#0F172A" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Iconic Single Buck Tooth -->
  <rect x="45" y="65" width="10" height="6.5" rx="1.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" />

  <!-- Chin Crease -->
  <path d="M 44 76 Q 50 79 56 76" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
</svg>
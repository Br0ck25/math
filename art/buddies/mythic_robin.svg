<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Forest Green Tunic (Shoulders) -->
  <path d="M 12 94 C 14 76 30 68 50 68 C 70 68 86 76 88 94 Z" fill="#15803D" stroke="#14532D" stroke-width="3" stroke-linejoin="round"/>

  <!-- Quiver Strap -->
  <path d="M 28 70 L 72 94" fill="none" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="82" r="2" fill="#FACC15"/>

  <!-- Tunic Collar -->
  <path d="M 36 70 Q 50 82 64 70" fill="none" stroke="#86EFAC" stroke-width="3" stroke-linecap="round"/>

  <!-- Hood (behind the face) -->
  <ellipse cx="50" cy="42" rx="31" ry="33" fill="#16A34A" stroke="#14532D" stroke-width="3"/>

  <!-- Face -->
  <ellipse cx="50" cy="49" rx="19.5" ry="21" fill="#F7C9A1" stroke="#5B3A29" stroke-width="3"/>

  <!-- Hood Front Rim over Forehead -->
  <path d="M 26 44 C 30 20 70 20 74 44 C 66 33 34 33 26 44 Z" fill="#15803D" stroke="#14532D" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Red Feather in the Cap -->
  <path d="M 62 24 C 76 8 90 10 88 18 C 84 28 72 30 62 24 Z" fill="#EF4444" stroke="#991B1B" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 64 24 C 72 18 80 14 86 14" fill="none" stroke="#991B1B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Cheeky Eyebrows -->
  <path d="M 34 43 Q 40 38 46 42" fill="none" stroke="#7C2D12" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 66 42 Q 60 36 54 42" fill="none" stroke="#7C2D12" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="41" cy="48" rx="4.6" ry="5.4" fill="#FFFFFF" stroke="#5B3A29" stroke-width="2"/>
  <circle cx="41.6" cy="49" r="2.6" fill="#1E293B"/>
  <circle cx="40.6" cy="47.6" r="0.9" fill="#FFFFFF"/>
  <ellipse cx="59" cy="48" rx="4.6" ry="5.4" fill="#FFFFFF" stroke="#5B3A29" stroke-width="2"/>
  <circle cx="58.4" cy="49" r="2.6" fill="#1E293B"/>
  <circle cx="57.4" cy="47.6" r="0.9" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <circle cx="33" cy="58" r="3.6" fill="#F87171" opacity="0.45"/>
  <circle cx="67" cy="58" r="3.6" fill="#F87171" opacity="0.45"/>

  <!-- Nose -->
  <path d="M 50 51 Q 53 56 49 57" fill="none" stroke="#B9835A" stroke-width="2" stroke-linecap="round"/>

  <!-- Thin Mustache and Pointed Beard -->
  <path d="M 40 61 Q 45 58 50 61 Q 55 58 60 61" fill="none" stroke="#7C2D12" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 43 68 Q 50 80 57 68 Q 50 72 43 68 Z" fill="#92400E" stroke="#7C2D12" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Big Merry Grin -->
  <path d="M 42 62 Q 50 71 58 62 Z" fill="#FFFFFF" stroke="#5B3A29" stroke-width="2" stroke-linejoin="round"/>
</svg>

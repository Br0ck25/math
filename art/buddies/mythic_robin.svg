<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pointed Fox Ears -->
  <!-- Left Ear -->
  <polygon points="26,36 12,14 36,22" fill="#EA580C" stroke="#7C2D12" stroke-width="3" stroke-linejoin="round" />
  <polygon points="25,32 17,20 31,25" fill="#FED7AA" />

  <!-- Right Ear -->
  <polygon points="74,36 88,14 64,22" fill="#EA580C" stroke="#7C2D12" stroke-width="3" stroke-linejoin="round" />
  <polygon points="75,32 83,20 69,25" fill="#FED7AA" />

  <!-- Iconic Bycocket Archer Cap (Lincoln Green) & Red Plume -->
  <!-- Long Red Plume / Feather -->
  <path d="M 28 22 C 22 10 16 4 12 2 C 18 10 24 18 26 26 Z" fill="#DC2626" stroke="#991B1B" stroke-width="1.8" stroke-linejoin="round" />
  <line x1="28" y1="22" x2="16" y2="4" stroke="#991B1B" stroke-width="1.2" stroke-linecap="round" />

  <!-- Cap Crown -->
  <path d="M 22 28 L 50 8 L 78 28 Z" fill="#4D7C0F" stroke="#1E293B" stroke-width="3" stroke-linejoin="round" />
  <!-- Turned-Up Cap Brim -->
  <path d="M 18 34 Q 50 24 82 34 L 80 28 Q 50 20 20 28 Z" fill="#65A30D" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Cheek Fur Spikes / Ruff -->
  <polygon points="20,46 10,52 18,58 8,64 20,68" fill="#EA580C" stroke="#7C2D12" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="80,46 90,52 82,58 92,64 80,68" fill="#EA580C" stroke="#7C2D12" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Rich Russet Fox Fur) -->
  <rect x="20" y="24" width="60" height="58" rx="20" fill="#EA580C" stroke="#7C2D12" stroke-width="3.5" />

  <!-- Cream / White Fox Cheeks & Lower Muzzle Mask -->
  <path d="
    M 20 54 
    C 20 72 32 80 50 80 
    C 68 80 80 72 80 54 
    C 74 58 66 58 58 50 
    C 54 46 50 46 46 46 
    C 42 46 38 46 34 50 
    C 26 58 20 58 20 54 
    Z" fill="#FFFBEB" stroke="#7C2D12" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Sassy / Dashing Eyebrows -->
  <path d="M 28 36 Q 37 30 45 36" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round" />
  <path d="M 72 36 Q 63 30 55 36" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round" />

  <!-- Clever, Expressive Warm Amber Fox Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="44" rx="8" ry="8.5" fill="#FFFFFF" stroke="#7C2D12" stroke-width="2.2" />
  <circle cx="38" cy="44" r="4.2" fill="#D97706" />
  <circle cx="38.5" cy="44" r="2.2" fill="#0F172A" />
  <circle cx="36.8" cy="42" r="1.1" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="44" rx="8" ry="8.5" fill="#FFFFFF" stroke="#7C2D12" stroke-width="2.2" />
  <circle cx="62" cy="44" r="4.2" fill="#D97706" />
  <circle cx="61.5" cy="44" r="2.2" fill="#0F172A" />
  <circle cx="59.8" cy="42" r="1.1" fill="#FFFFFF" />

  <!-- Fox Nose (Glossy Black Triangular Snout Tip) -->
  <path d="M 45 52 C 45 50 47 49 50 49 C 53 49 55 50 55 52 C 55 56 53 58 50 58 C 47 58 45 56 45 52 Z" fill="#0F172A" stroke="#7C2D12" stroke-width="1.8" stroke-linejoin="round" />
  <circle cx="48.5" cy="51.5" r="0.8" fill="#FFFFFF" />

  <!-- Muzzle Center Seam -->
  <line x1="50" y1="58" x2="50" y2="63" stroke="#7C2D12" stroke-width="2" stroke-linecap="round" />

  <!-- Whisker Freckle Dots -->
  <circle cx="41" cy="62" r="1" fill="#B45309" />
  <circle cx="38" cy="66" r="1" fill="#B45309" />
  <circle cx="59" cy="62" r="1" fill="#B45309" />
  <circle cx="62" cy="66" r="1" fill="#B45309" />

  <!-- Charming Rogue Smirk / Grin -->
  <path d="M 38 65 Q 50 73 62 64" fill="none" stroke="#7C2D12" stroke-width="2.8" stroke-linecap="round" />

  <!-- Sherwood Forest Tunic V-Neck Collar Base -->
  <g>
    <!-- Forest Green Tunic Base -->
    <path d="M 24 80 Q 50 86 76 80 L 76 88 Q 50 94 24 88 Z" fill="#65A30D" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Yellow Undershirt V-Neck Peek -->
    <polygon points="50,86 42,80 58,80" fill="#FACC15" stroke="#1E293B" stroke-width="1.4" stroke-linejoin="round" />
  </g>
</svg>
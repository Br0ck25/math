<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Long Silver Hair (Flowing Behind Head) -->
  <path d="
    M 22 42 
    C 14 50 12 70 18 84 
    C 24 84 30 84 30 84
    L 70 84
    C 70 84 76 84 82 84
    C 88 70 86 50 78 42 
    Z" fill="#E2E8F0" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Skin Tone) -->
  <rect x="24" y="28" width="52" height="52" rx="18" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Wizard / Professor Hat (Deep Purple / Plum with Gold Tassel) -->
  <!-- Hat Brim -->
  <path d="M 18 36 Q 50 28 82 36 L 80 30 Q 50 22 20 30 Z" fill="#4C1D95" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Hat Crown -->
  <path d="M 28 30 L 34 10 L 66 10 L 72 30 Z" fill="#5B21B6" stroke="#1E293B" stroke-width="3" stroke-linejoin="round" />
  <!-- Gold Hat Trim / Embroidery Band -->
  <path d="M 27 28 Q 50 22 73 28 L 74 31 Q 50 25 26 31 Z" fill="#FACC15" />
  <!-- Hanging Tassel -->
  <path d="M 66 12 Q 74 15 76 24" fill="none" stroke="#FACC15" stroke-width="2" stroke-linecap="round" />
  <circle cx="76" cy="25" r="2.2" fill="#FACC15" />

  <!-- Bushy White / Silver Eyebrows -->
  <path d="M 28 41 Q 37 36 45 42" fill="none" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 55 42 Q 63 36 72 41" fill="none" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round" />

  <!-- Twinkling Blue Eyes -->
  <!-- Left Eye -->
  <circle cx="37" cy="48" r="3.2" fill="#38BDF8" />
  <circle cx="37" cy="48" r="1.8" fill="#0F172A" />
  <circle cx="36" cy="46.5" r="0.9" fill="#FFFFFF" />
  <!-- Right Eye -->
  <circle cx="63" cy="48" r="3.2" fill="#38BDF8" />
  <circle cx="63" cy="48" r="1.8" fill="#0F172A" />
  <circle cx="62" cy="46.5" r="0.9" fill="#FFFFFF" />

  <!-- Half-Moon Spectacles (Tucked Lower on the Crooked Nose) -->
  <!-- Left Half-Moon Lens -->
  <path d="M 29 48 L 45 48 C 45 54 29 54 29 48 Z" fill="#FFFFFF" fill-opacity="0.5" stroke="#FACC15" stroke-width="1.8" />
  <!-- Right Half-Moon Lens -->
  <path d="M 55 48 L 71 48 C 71 54 55 54 55 48 Z" fill="#FFFFFF" fill-opacity="0.5" stroke="#FACC15" stroke-width="1.8" />
  <!-- Spectacle Bridge -->
  <path d="M 45 48 Q 50 45 55 48" fill="none" stroke="#FACC15" stroke-width="1.8" stroke-linecap="round" />

  <!-- Signature Crooked Broken Nose -->
  <path d="M 49 46 L 52 52 L 48 57 L 52 58" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" />

  <!-- Grand Flowing Silver Beard & Mustache -->
  <path d="
    M 24 56 
    C 20 66 26 84 38 90 
    C 44 93 47 96 50 96 
    C 53 96 56 93 62 90 
    C 74 84 80 66 76 56 
    C 70 58 64 56 50 60 
    C 36 56 30 58 24 56 
    Z" fill="#F1F5F9" stroke="#1E293B" stroke-width="3" stroke-linejoin="round" />

  <!-- Beard Texture Strands -->
  <path d="M 44 68 Q 42 80 47 88" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <path d="M 50 66 Q 50 82 50 92" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <path d="M 56 68 Q 58 80 53 88" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

  <!-- Mustache Accent -->
  <path d="M 38 60 Q 50 67 62 60" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />

  <!-- Gentle Knowing Smile Peeking Through Beard -->
  <path d="M 44 65 Q 50 69 56 65" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
</svg>
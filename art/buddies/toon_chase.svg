<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <rect width="100" height="100" rx="24" fill="#DBEAFE" />

  <!-- German Shepherd Pointed Ears -->
  <!-- Left Ear -->
  <polygon points="28,38 14,8 38,20" fill="#78350F" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
  <polygon points="27,33 19,16 34,23" fill="#D97706" />

  <!-- Right Ear -->
  <polygon points="72,38 86,8 62,20" fill="#78350F" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
  <polygon points="73,33 81,16 66,23" fill="#D97706" />

  <!-- Main Head Shape (German Shepherd Brown) -->
  <rect x="22" y="24" width="56" height="58" rx="18" fill="#92400E" stroke="#451A03" stroke-width="3.5" />

  <!-- Police Cap Crown (Deep Blue) -->
  <path d="M 24 28 C 24 16 76 16 76 28 Z" fill="#1D4ED8" stroke="#1E3A8A" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Police Cap Visor / Brim (Black) -->
  <path d="M 20 28 Q 50 34 80 28 L 82 32 Q 50 39 18 32 Z" fill="#0F172A" stroke="#020617" stroke-width="1.5" />

  <!-- Cap Yellow Trim / Ribbon -->
  <path d="M 25 27 Q 50 30 75 27" fill="none" stroke="#FACC15" stroke-width="2.5" />

  <!-- Cap Badge (Paw Print Crest) -->
  <polygon points="50,16 57,20 55,27 50,30 45,27 43,20" fill="#FACC15" stroke="#B45309" stroke-width="1" />
  <circle cx="50" cy="23" r="1.8" fill="#1E3A8A" />
  <circle cx="48" cy="20" r="0.8" fill="#1E3A8A" />
  <circle cx="50" cy="19" r="0.8" fill="#1E3A8A" />
  <circle cx="52" cy="20" r="0.8" fill="#1E3A8A" />

  <!-- Expressive Eyebrows -->
  <rect x="28" y="34" width="13" height="4" rx="2" fill="#D97706" />
  <rect x="59" y="34" width="13" height="4" rx="2" fill="#D97706" />

  <!-- Big Curious Eyes -->
  <ellipse cx="36" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#451A03" stroke-width="2" />
  <circle cx="37" cy="46" r="3.8" fill="#854D0E" />
  <circle cx="37" cy="46" r="2.2" fill="#0F172A" />
  <circle cx="35" cy="43.5" r="1.2" fill="#FFFFFF" />

  <ellipse cx="64" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#451A03" stroke-width="2" />
  <circle cx="63" cy="46" r="3.8" fill="#854D0E" />
  <circle cx="63" cy="46" r="2.2" fill="#0F172A" />
  <circle cx="61" cy="43.5" r="1.2" fill="#FFFFFF" />

  <!-- Tan / Cream Muzzle -->
  <rect x="30" y="52" width="40" height="26" rx="12" fill="#FDE68A" stroke="#451A03" stroke-width="2.5" />

  <!-- Black Pup Nose -->
  <ellipse cx="50" cy="58" rx="7" ry="5" fill="#0F172A" />
  <ellipse cx="48.5" cy="56.5" rx="2" ry="1.2" fill="#64748B" />

  <!-- Cheerful Pup Grin with Tongue -->
  <path d="M 43 67 Q 50 74 57 67" fill="#881337" stroke="#451A03" stroke-width="2" />
  <path d="M 46 70 Q 50 67 54 70" fill="#FB7185" />

  <!-- Whisker Dots -->
  <circle cx="37" cy="63" r="1" fill="#78350F" />
  <circle cx="35" cy="67" r="1" fill="#78350F" />
  <circle cx="63" cy="63" r="1" fill="#78350F" />
  <circle cx="65" cy="67" r="1" fill="#78350F" />
</svg>
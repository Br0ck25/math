<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <!-- Left Ear -->
  <polygon points="26,42 15,12 39,22" fill="#1E293B" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="25,36 19,18 35,25" fill="#FDE047"/>
  <!-- Right Ear -->
  <polygon points="74,42 85,12 61,22" fill="#1E293B" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="75,36 81,18 65,25" fill="#FDE047"/>
  <!-- Main Body / Head Block (Bandit Dark Blue) -->
  <rect x="22" y="22" width="56" height="60" rx="18" fill="#1E40AF" stroke="#0F172A" stroke-width="3.5"/>
  <!-- Bandit Black Mask Patch across eyes/forehead -->
  <path d="M 22 36 Q 50 30 78 36 L 78 56 Q 50 62 22 56 Z" fill="#1E293B"/>
  <!-- Bushy Pale Grayish-Blue Eyebrows -->
  <rect x="27" y="29" width="16" height="6" rx="2.5" fill="#93C5FD" stroke="#0F172A" stroke-width="1.5"/>
  <rect x="57" y="29" width="16" height="6" rx="2.5" fill="#93C5FD" stroke="#0F172A" stroke-width="1.5"/>
  <!-- Eyes -->
  <ellipse cx="36" cy="45" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <circle cx="37" cy="45" r="3.5" fill="#0F172A"/>
  <circle cx="35" cy="43" r="1.2" fill="#FFFFFF"/>
  <ellipse cx="64" cy="45" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <circle cx="63" cy="45" r="3.5" fill="#0F172A"/>
  <circle cx="61" cy="43" r="1.2" fill="#FFFFFF"/>
  <!-- Muzzle / Snout Area -->
  <rect x="29" y="52" width="42" height="28" rx="13" fill="#FDE047" stroke="#0F172A" stroke-width="2.5"/>
  <!-- 5 o'clock Shadow / Whisker Freckles -->
  <circle cx="35" cy="67" r="1.2" fill="#78350F"/>
  <circle cx="38" cy="71" r="1.2" fill="#78350F"/>
  <circle cx="65" cy="67" r="1.2" fill="#78350F"/>
  <circle cx="62" cy="71" r="1.2" fill="#78350F"/>
  <!-- Large Dog Nose -->
  <ellipse cx="50" cy="58" rx="8" ry="5.5" fill="#0F172A"/>
  <ellipse cx="48" cy="56.5" rx="2.2" ry="1.4" fill="#64748B"/>
  <!-- Signature Smirk / Smile -->
  <path d="M 43 68 Q 50 73 58 66" fill="transparent" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
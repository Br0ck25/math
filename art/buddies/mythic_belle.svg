  <!-- Soft Wavy Loose Side Strands -->
  <path d="M 23 44 Q 21 54 23 60" fill="none" stroke="#783F1D" stroke-width="2" stroke-linecap="round" />
  <path d="M 77 44 Q 79 54 77 60" fill="none" stroke="#783F1D" stroke-width="2" stroke-linecap="round" />

  <!-- Refined Elegant Brunette Eyebrows -->
  <path d="M 28 38 Q 36 32 44 37" fill="none" stroke="#3D200E" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 56 37 Q 64 32 72 38" fill="none" stroke="#3D200E" stroke-width="2.6" stroke-linecap="round" />

  <!-- Eyelashes & Wing Accents -->
  <!-- Left Eye Lashes -->
  <path d="M 28 43 Q 37 39 45 43" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="28" y1="43" x2="25" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="33" y1="41" x2="31" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Right Eye Lashes -->
  <path d="M 55 43 Q 63 39 72 43" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="72" y1="43" x2="75" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="67" y1="41" x2="69" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Warm Hazel / Amber Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="4.4" fill="#92400E" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="36.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="39.8" cy="49.5" r="0.7" fill="#F59E0B" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="48" r="4.4" fill="#92400E" />
  <circle cx="61.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="59.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="62.8" cy="49.5" r="0.7" fill="#F59E0B" />

  <!-- Dainty Gentle Nose -->
  <path d="M 48 56 Q 50 59 53 57" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

  <!-- Soft Cheerful Blush -->
  <circle cx="28" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />
  <circle cx="72" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />

  <!-- Intelligent, Warm Rosy Smile -->
  <path d="M 39 67 Q 50 74 61 67" fill="none" stroke="#E11D48" stroke-width="2.6" stroke-linecap="round" />

  <!-- Golden Ballroom Ballgown Off-the-Shoulder Collar Base -->
  <g>
    <!-- Gown Swag / Drape Fold -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#FACC15" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Scalloped Pleat Trim -->
    <path d="M 32 82 Q 41 87 50 84 Q 59 87 68 82" fill="none" stroke="#EAB308" stroke-width="1.6" />
    <!-- Center Red Enchanted Rose Accent -->
    <circle cx="50" cy="84" r="2.8" fill="#E11D48" stroke="#9F1239" stroke-width="1" />
    <circle cx="50" cy="84" r="1.2" fill="#FDA4AF" />
  </g>

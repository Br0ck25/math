<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears & Gold Pearl Drop Earrings -->
  <!-- Left Ear -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <circle cx="19" cy="63" r="2.4" fill="#FACC15" stroke="#CA8A04" stroke-width="1.2" />

  <!-- Right Ear -->
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <circle cx="81" cy="63" r="2.4" fill="#FACC15" stroke="#CA8A04" stroke-width="1.2" />

  <!-- Top Bun / Chignon with Golden Ribbon Band -->
  <ellipse cx="50" cy="11" rx="14" ry="9" fill="#5A3319" stroke="#1E293B" stroke-width="3" stroke-linejoin="round" />
  <ellipse cx="50" cy="11" rx="9" ry="5.5" fill="#783F1D" />
  <path d="M 40 18 Q 50 14 60 18 L 61 21 Q 50 17 39 21 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="1.2" />

  <!-- Rich Warm Brunette Hair (Back Silhouette) -->
  <path d="
    M 20 44 
    C 10 26 16 12 34 8 
    C 44 6 56 6 66 8 
    C 84 12 90 26 80 44 
    C 88 58 86 76 80 84 
    L 20 84 
    C 14 76 12 58 20 44 
    Z" fill="#5A3319" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Fair Warm Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Center-Parted Elegant Front Bangs / Hair Swirls -->
  <path d="
    M 21 34 
    Q 32 38 42 26 
    Q 48 34 50 24 
    Q 52 34 58 26 
    Q 68 38 79 34 
    L 79 24 
    Q 50 12 21 24 

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <!-- Chocolate Labrador Floppy Ears (Deep Chocolate Brown) -->
  <!-- Left Ear -->
  <path d="M 28 38 C 14 44 13 65 19 75 C 23 80 30 79 33 72 C 35 66 33 50 31 40 Z" fill="#451A03" stroke="#270F02" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right Ear -->
  <path d="M 72 38 C 86 44 87 65 81 75 C 77 80 70 79 67 72 C 65 66 67 50 69 40 Z" fill="#451A03" stroke="#270F02" stroke-width="3" stroke-linejoin="round"/>
  <!-- Main Head Shape (Rich Chocolate Brown) -->
  <rect x="22" y="24" width="56" height="58" rx="18" fill="#78350F" stroke="#270F02" stroke-width="3.5"/>
  <!-- Water Rescue Helmet Dome (Bright Orange) -->
  <path d="M 22 32 C 22 14 78 14 78 32 Z" fill="#EA580C" stroke="#9A3412" stroke-width="3" stroke-linejoin="round"/>
  <!-- Helmet Visor / Brim -->
  <path d="M 18 32 Q 50 38 82 32 L 84 36 Q 50 43 16 36 Z" fill="#C2410C" stroke="#7C2D12" stroke-width="1.5"/>
  <!-- Aquatic Blue / Dark Blue Helmet Stripe -->
  <path d="M 25 27 Q 50 30 75 27" fill="none" stroke="#0284C7" stroke-width="2.5"/>
  <!-- Water Rescue Badge Emblem (Silver Anchor on Shield) -->
  <polygon points="50,14 58,19 56,27 50,31 44,27 42,19" fill="#FFFFFF" stroke="#9A3412" stroke-width="1"/>
  <!-- Tiny Anchor Symbol -->
  <circle cx="50" cy="18" r="1.2" fill="none" stroke="#0284C7" stroke-width="0.9"/>
  <line x1="50" y1="19.2" x2="50" y2="27" stroke="#0284C7" stroke-width="1.1"/>
  <path d="M 46 24 Q 50 28 54 24" fill="none" stroke="#0284C7" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Playful Eyebrows -->
  <rect x="28" y="35" width="13" height="4" rx="2" fill="#451A03"/>
  <rect x="59" y="35" width="13" height="4" rx="2" fill="#451A03"/>
  <!-- Big Pup Eyes (Zuma's Hazel/Amber Eyes) -->
  <ellipse cx="36" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#270F02" stroke-width="2"/>
  <circle cx="37" cy="46" r="3.8" fill="#D97706"/>
  <circle cx="37" cy="46" r="2.2" fill="#0F172A"/>
  <circle cx="35" cy="43.5" r="1.3" fill="#FFFFFF"/>
  <ellipse cx="64" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#270F02" stroke-width="2"/>
  <circle cx="63" cy="46" r="3.8" fill="#D97706"/>
  <circle cx="63" cy="46" r="2.2" fill="#0F172A"/>
  <circle cx="61" cy="43.5" r="1.3" fill="#FFFFFF"/>
  <!-- Warm Tan Muzzle -->
  <rect x="30" y="52" width="40" height="26" rx="12" fill="#B45309" stroke="#270F02" stroke-width="2.5"/>
  <!-- Dark Chocolate Dog Nose -->
  <ellipse cx="50" cy="58" rx="7" ry="5" fill="#270F02"/>
  <ellipse cx="48.5" cy="56.5" rx="2" ry="1.2" fill="#92400E"/>
  <!-- Whisker Spots on Muzzle -->
  <circle cx="37" cy="64" r="1" fill="#451A03"/>
  <circle cx="35" cy="68" r="1" fill="#451A03"/>
  <circle cx="63" cy="64" r="1" fill="#451A03"/>
  <circle cx="65" cy="68" r="1" fill="#451A03"/>
  <!-- Energetic Open Grin with Tongue -->
  <path d="M 43 67 Q 50 74 57 67" fill="#881337" stroke="#270F02" stroke-width="2"/>
  <path d="M 46 70 Q 50 67 54 70" fill="#FB7185"/>
</svg>
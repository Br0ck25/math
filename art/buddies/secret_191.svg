<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <rect width="100" height="100" rx="24" fill="#DCFCE7" />

  <!-- Left Antenna -->
  <path d="M 40 32 Q 28 14 18 10" fill="none" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round" />
  <!-- Left Antenna Stripes / Segments -->
  <line x1="28" y1="18" x2="33" y2="21" stroke="#064E3B" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="13" x2="26" y2="16" stroke="#064E3B" stroke-width="2" stroke-linecap="round" />

  <!-- Right Antenna -->
  <path d="M 60 32 Q 72 14 82 10" fill="none" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round" />
  <!-- Right Antenna Stripes / Segments -->
  <line x1="72" y1="18" x2="67" y2="21" stroke="#064E3B" stroke-width="2" stroke-linecap="round" />
  <line x1="78" y1="13" x2="74" y2="16" stroke="#064E3B" stroke-width="2" stroke-linecap="round" />

  <!-- Bean / Capsule Body (Plankton Teal-Green) -->
  <rect x="30" y="26" width="40" height="58" rx="20" fill="#059669" stroke="#064E3B" stroke-width="3.5" />

  <!-- Angry / Determined Monobrow -->
  <path d="M 32 37 Q 50 46 68 37" fill="#064E3B" stroke="#064E3B" stroke-width="4.5" stroke-linecap="round" />

  <!-- Giant Single Central Eye -->
  <ellipse cx="50" cy="51" rx="14" ry="14" fill="#FFFFFF" stroke="#064E3B" stroke-width="2.5" />

  <!-- Red / Crimson Iris -->
  <circle cx="50" cy="51" r="7" fill="#DC2626" />

  <!-- Yellow Pupil -->
  <circle cx="50" cy="51" r="3.2" fill="#FACC15" />

  <!-- Eye Highlight -->
  <circle cx="47" cy="48" r="1.3" fill="#FFFFFF" />

  <!-- Scheming Evil Grin -->
  <path d="M 38 71 Q 50 81 62 71" fill="#7F1D1D" stroke="#064E3B" stroke-width="2" />

  <!-- Tiny Sharp Teeth Line inside grin -->
  <path d="M 41 71 Q 50 76 59 71" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="2,1.5" />

  <!-- Little Stubby Arms -->
  <ellipse cx="26" cy="62" rx="4.5" ry="3" fill="#059669" stroke="#064E3B" stroke-width="2" />
  <ellipse cx="74" cy="62" rx="4.5" ry="3" fill="#059669" stroke="#064E3B" stroke-width="2" />
</svg>
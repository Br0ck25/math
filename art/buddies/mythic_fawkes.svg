<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Flame Feather Head Crest Plumes (Crimson, Amber, Gold) -->
  <path d="M 36 26 C 26 12 36 4 44 14 C 47 4 57 4 58 14 C 64 6 74 12 64 26 Z" fill="#DC2626" stroke="#7F1D1D" stroke-width="3" stroke-linejoin="round" />
  <!-- Inner Golden Fire Tufts -->
  <path d="M 42 22 C 37 12 43 7 48 14 C 50 8 56 8 54 16" fill="#FACC15" stroke="#B45309" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Phoenix Neck Base -->
  <path d="M 38 78 L 34 88 L 66 88 L 62 78 Z" fill="#B91C1C" stroke="#7F1D1D" stroke-width="3" stroke-linejoin="round" />
  <!-- Golden Neck Feathers / Collar -->
  <path d="M 34 84 Q 50 90 66 84 L 64 88 Q 50 93 36 88 Z" fill="#F59E0B" stroke="#7F1D1D" stroke-width="1.8" />

  <!-- Main Phoenix Head Squircle Base (Rich Crimson) -->
  <rect x="24" y="24" width="52" height="54" rx="20" fill="#DC2626" stroke="#7F1D1D" stroke-width="3.5" />

  <!-- Golden Facial Feather Mask / Cheeks -->
  <path d="M 24 50 C 24 68 36 76 50 76 C 64 76 76 68 76 50 C 76 40 68 44 50 46 C 32 44 24 40 24 50 Z" fill="#F59E0B" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Crown Feather Wisps -->
  <path d="M 32 30 Q 38 24 46 29" fill="none" stroke="#FACC15" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 68 30 Q 62 24 54 29" fill="none" stroke="#FACC15" stroke-width="2.2" stroke-linecap="round" />

  <!-- Noble / Wise Phoenix Eyebrows -->
  <path d="M 31 38 Q 40 33 46 39" fill="none" stroke="#7F1D1D" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 69 38 Q 60 33 54 39" fill="none" stroke="#7F1D1D" stroke-width="2.6" stroke-linecap="round" />

  <!-- Glowing Golden Phoenix Eyes with Tear Duct Accent -->
  <!-- Left Eye -->
  <ellipse cx="38" cy="46" rx="7.5" ry="9" fill="#FFFFFF" stroke="#7F1D1D" stroke-width="2" />
  <ellipse cx="39" cy="46" rx="5" ry="6.5" fill="#F59E0B" />
  <circle cx="39.5" cy="46" r="3" fill="#0F172A" />
  <circle cx="38" cy="44" r="1.1" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="62" cy="46" rx="7.5" ry="9" fill="#FFFFFF" stroke="#7F1D1D" stroke-width="2" />
  <ellipse cx="61" cy="46" rx="5" ry="6.5" fill="#F59E0B" />
  <circle cx="60.5" cy="46" r="3" fill="#0F172A" />
  <circle cx="59" cy="44" r="1.1" fill="#FFFFFF" />

  <!-- Phoenix Healing Tear (Iconic Glistening Drop) -->
  <path d="M 67 52 C 67 50 71 47 71 45 C 71 47 75 50 75 52 C 75 55 73 57 71 57 C 69 57 67 55 67 52 Z" fill="#38BDF8" stroke="#0284C7" stroke-width="1.2" />
  <circle cx="70.5" cy="51" r="0.8" fill="#FFFFFF" />

  <!-- Curved Regal Gold Phoenix Beak -->
  <path d="M 40 54 C 40 52 46 51 50 51 C 54 51 60 52 60 54 C 60 62 56 70 50 73 C 44 70 40 62 40 54 Z" fill="#FACC15" stroke="#B45309" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Beak Nostril Slits -->
  <line x1="46" y1="55" x2="48" y2="57" stroke="#B45309" stroke-width="1.4" stroke-linecap="round" />
  <line x1="54" y1="55" x2="52" y2="57" stroke="#B45309" stroke-width="1.4" stroke-linecap="round" />

  <!-- Beak Hook Line -->
  <path d="M 50 57 L 50 69" stroke="#B45309" stroke-width="1.6" stroke-linecap="round" />

  <!-- Cheek Flame Tufts -->
  <polygon points="24,54 16,58 24,62" fill="#DC2626" stroke="#7F1D1D" stroke-width="2" stroke-linejoin="round" />
  <polygon points="76,54 84,58 76,62" fill="#DC2626" stroke="#7F1D1D" stroke-width="2" stroke-linejoin="round" />
</svg>
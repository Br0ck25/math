<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />

  <!-- Iconic Black Hair Ribbon / Bow on Top -->
  <!-- Left Bow Loop -->
  <path d="M 47 16 C 36 10 32 18 45 22 Z" fill="#0F172A" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
  <!-- Right Bow Loop -->
  <path d="M 53 16 C 64 10 68 18 55 22 Z" fill="#0F172A" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
  <!-- Center Knot -->
  <ellipse cx="50" cy="19" rx="3.5" ry="2.8" fill="#1E293B" stroke="#0F172A" stroke-width="1.6" />
  <!-- Black Headband Under Hair -->
  <path d="M 24 28 C 24 14 76 14 76 28 L 74 31 C 74 18 26 18 26 31 Z" fill="#0F172A" />

  <!-- Smooth Bright Canary-Blonde Hair (Back Volume / Shoulder Length) -->
  <path d="
    M 20 44 
    C 10 26 16 12 34 8 
    C 44 6 56 6 66 8 
    C 84 12 90 26 80 44 
    C 88 58 86 76 80 84 
    L 20 84 
    C 14 76 12 58 20 44 
    Z" fill="#FACC15" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Fair Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Classic Curved Center-Parted Bangs -->
  <path d="
    M 21 34 
    Q 32 40 44 28 
    Q 50 36 54 26 
    Q 62 38 72 26 
    Q 76 36 79 32 
    L 79 24 
    Q 50 12 21 24 
    Z" fill="#FACC15" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Blonde Hair Strands & Highlights -->
  <path d="M 34 13 Q 39 23 35 28" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />
  <path d="M 64 13 Q 60 23 65 28" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />

  <!-- Curious Raised Eyebrows -->
  <path d="M 28 38 Q 36 31 44 36" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 56 36 Q 64 31 72 38" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" />

  <!-- Eyelashes -->
  <!-- Left Eye Lashes -->
  <path d="M 28 43 Q 37 39 45 43" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="28" y1="43" x2="25" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="33" y1="41" x2="31" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Right Eye Lashes -->
  <path d="M 55 43 Q 63 39 72 43" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="72" y1="43" x2="75" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="67" y1="41" x2="69" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Wide Curious Periwinkle / Sky Blue Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="4.4" fill="#38BDF8" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="36.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="39.8" cy="49.5" r="0.7" fill="#BAE6FD" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="48" r="4.4" fill="#38BDF8" />
  <circle cx="61.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="59.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="62.8" cy="49.5" r="0.7" fill="#BAE6FD" />

  <!-- Petite Button Nose -->
  <path d="M 48 56 Q 50 59 53 57" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

  <!-- Soft Rosy Cheeks -->
  <circle cx="28" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />
  <circle cx="72" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />

  <!-- Polite Curious Smile -->
  <path d="M 39 67 Q 50 74 61 67" fill="none" stroke="#E11D48" stroke-width="2.6" stroke-linecap="round" />

  <!-- Alice Blue Dress & White Pinafore Apron Collar Base -->
  <g>
    <!-- Sky Blue Dress Bodice Fold -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#38BDF8" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- White Pinafore Bib / Straps -->
    <polygon points="36,80 42,88 58,88 64,80" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6" stroke-linejoin="round" />
    <!-- White Peter Pan Collar Flaps -->
    <path d="M 36 80 Q 43 83 50 80 Q 43 78 36 80 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <path d="M 64 80 Q 57 83 50 80 Q 57 78 64 80 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  </g>
</svg>
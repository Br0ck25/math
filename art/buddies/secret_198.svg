<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <rect width="100" height="100" rx="24" fill="#FEF3C7" />

  <!-- Giant Chihuahua Radar Ears (Tracker's signature oversized ears) -->
  <!-- Left Ear -->
  <polygon points="28,42 8,6 38,18" fill="#78350F" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
  <polygon points="26,36 14,14 34,22" fill="#FDE68A" />

  <!-- Right Ear -->
  <polygon points="72,42 92,6 62,18" fill="#78350F" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
  <polygon points="74,36 86,14 66,22" fill="#FDE68A" />

  <!-- Main Chihuahua Head Shape (Warm Brown) -->
  <rect x="22" y="24" width="56" height="58" rx="18" fill="#92400E" stroke="#451A03" stroke-width="3.5" />

  <!-- Jungle Safari Hat Crown (Olive Green) -->
  <path d="M 24 28 C 24 16 76 16 76 28 Z" fill="#65A30D" stroke="#365314" stroke-width="3" stroke-linejoin="round" />

  <!-- Safari Hat Wide Flapped Brim -->
  <path d="M 16 28 Q 50 34 84 28 L 86 32 Q 50 39 14 32 Z" fill="#4D7C0F" stroke="#1A2E05" stroke-width="1.5" />

  <!-- Hat Brown Leather Band -->
  <path d="M 24 27 Q 50 30 76 27" fill="none" stroke="#78350F" stroke-width="2.5" />

  <!-- Jungle Paw Crest Badge (Compass / Paw Shield) -->
  <polygon points="50,15 57,19 55,27 50,30 45,27 43,19" fill="#FFFFFF" stroke="#365314" stroke-width="1" />
  <!-- Compass Needle Emblem -->
  <polygon points="50,18 52,23 50,22 48,23" fill="#DC2626" />
  <polygon points="50,26 52,23 50,24 48,23" fill="#4B5563" />

  <!-- White Face Mask / Fur Marking across Forehead and Cheeks -->
  <path d="M 28 42 C 34 44 42 43 44 46 C 44 48 34 50 30 54 L 70 54 C 66 50 56 48 56 46 C 58 43 66 44 72 42 C 74 48 76 54 76 60 C 76 74 65 80 50 80 C 35 80 24 74 24 60 C 24 54 26 48 28 42 Z" fill="#FFFFFF" />

  <!-- Expressive Chihuahua Eyebrows -->
  <rect x="28" y="34" width="13" height="4" rx="2" fill="#451A03" />
  <rect x="59" y="34" width="13" height="4" rx="2" fill="#451A03" />

  <!-- Big Alert Dark Brown Pup Eyes -->
  <ellipse cx="36" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#451A03" stroke-width="2" />
  <circle cx="37" cy="46" r="3.8" fill="#78350F" />
  <circle cx="37" cy="46" r="2.2" fill="#0F172A" />
  <circle cx="35" cy="43.5" r="1.3" fill="#FFFFFF" />

  <ellipse cx="64" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#451A03" stroke-width="2" />
  <circle cx="63" cy="46" r="3.8" fill="#78350F" />
  <circle cx="63" cy="46" r="2.2" fill="#0F172A" />
  <circle cx="61" cy="43.5" r="1.3" fill="#FFFFFF" />

  <!-- Rosy Cheeks -->
  <circle cx="28" cy="56" r="3.5" fill="#F472B6" opacity="0.45" />
  <circle cx="72" cy="56" r="3.5" fill="#F472B6" opacity="0.45" />

  <!-- White Chihuahua Muzzle -->
  <rect x="30" y="52" width="40" height="26" rx="12" fill="#FFFFFF" stroke="#451A03" stroke-width="2.5" />

  <!-- Small Black Dog Nose -->
  <ellipse cx="50" cy="58" rx="6.5" ry="4.5" fill="#0F172A" />
  <ellipse cx="48.5" cy="56.8" rx="1.8" ry="1.1" fill="#64748B" />

  <!-- Whisker Dots -->
  <circle cx="37" cy="64" r="1" fill="#78350F" />
  <circle cx="35" cy="68" r="1" fill="#78350F" />
  <circle cx="63" cy="64" r="1" fill="#78350F" />
  <circle cx="65" cy="68" r="1" fill="#78350F" />

  <!-- Cheerful Grin with Tongue -->
  <path d="M 43 67 Q 50 74 57 67" fill="#881337" stroke="#451A03" stroke-width="2" />
  <path d="M 46 70 Q 50 67 54 70" fill="#FB7185" />

  <!-- Red Jungle Collar Strip at Base -->
  <rect x="32" y="80" width="36" height="4" rx="2" fill="#DC2626" />
</svg>
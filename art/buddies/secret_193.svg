  <polygon points="50,14 58,19 56,27 50,31 44,27 42,19" fill="#FACC15" stroke="#CA8A04" stroke-width="1"/>
  <!-- Fire Flame Emblem inside Shield -->
  <path d="M 50 18 C 52 21 54 23 52 26 C 51 28 49 28 48 26 C 47 24 49 22 50 18 Z" fill="#DC2626"/>
  <!-- Head Dalmatian Spots -->
  <circle cx="27" cy="46" r="3" fill="#0F172A"/>
  <circle cx="73" cy="46" r="3.2" fill="#0F172A"/>
  <circle cx="50" cy="41" r="2.5" fill="#0F172A"/>
  <!-- Playful Expressive Eyebrows -->
  <rect x="28" y="36" width="13" height="4" rx="2" fill="#0F172A"/>
  <rect x="59" y="36" width="13" height="4" rx="2" fill="#0F172A"/>
  <!-- Wide Clumsy/Happy Pup Eyes (Marshall's Bright Blue Eyes) -->
  <ellipse cx="36" cy="47" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <circle cx="37" cy="47" r="3.8" fill="#0284C7"/>
  <circle cx="37" cy="47" r="2.2" fill="#0F172A"/>
  <circle cx="35" cy="44.5" r="1.3" fill="#FFFFFF"/>
  <ellipse cx="64" cy="47" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <circle cx="63" cy="47" r="3.8" fill="#0284C7"/>
  <circle cx="63" cy="47" r="2.2" fill="#0F172A"/>
  <circle cx="61" cy="44.5" r="1.3" fill="#FFFFFF"/>
  <!-- White Snout / Muzzle -->
  <rect x="30" y="53" width="40" height="25" rx="12" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5"/>
  <!-- Black Dalmatian Dog Nose -->
  <ellipse cx="50" cy="59" rx="7" ry="5" fill="#0F172A"/>
  <ellipse cx="48.5" cy="57.5" rx="2" ry="1.2" fill="#64748B"/>
  <!-- Whisker Spots on Muzzle -->
  <circle cx="36" cy="65" r="1" fill="#0F172A"/>
  <circle cx="38" cy="69" r="1" fill="#0F172A"/>
  <circle cx="64" cy="65" r="1" fill="#0F172A"/>
  <circle cx="62" cy="69" r="1" fill="#0F172A"/>
  <!-- Huge Goofy Grin with Tongue -->
  <path d="M 42 68 Q 50 76 58 68" fill="#881337" stroke="#0F172A" stroke-width="2"/>
  <path d="M 46 71 Q 50 68 54 71" fill="#FB7185"/>

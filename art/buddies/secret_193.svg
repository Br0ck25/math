  <circle cx="77" cy="58" r="4.5" fill="#0F172A"/>
  <circle cx="72" cy="72" r="3" fill="#0F172A"/>
  <!-- Main Dalmatian Head Shape (White) -->
  <rect x="22" y="24" width="56" height="58" rx="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>
  <!-- Firefighter Helmet Crown (Vibrant Red) -->
  <path d="M 22 32 C 22 14 78 14 78 32 Z" fill="#DC2626" stroke="#991B1B" stroke-width="3" stroke-linejoin="round"/>

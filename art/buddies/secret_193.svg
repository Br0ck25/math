<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <!-- Dalmatian Floppy Ears (Behind head) -->
  <!-- Left Ear -->
  <path d="M 28 36 C 14 42 12 66 18 78 C 22 84 30 84 34 76 C 36 70 34 50 32 38 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left Ear Dalmatian Spot -->
  <circle cx="23" cy="58" r="4.5" fill="#0F172A"/>
  <circle cx="28" cy="72" r="3" fill="#0F172A"/>
  <!-- Right Ear -->
  <path d="M 72 36 C 86 42 88 66 82 78 C 78 84 70 84 66 76 C 64 70 66 50 68 38 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pointed Cat Ears -->
  <!-- Left Ear -->
  <polygon points="26,38 15,10 39,22" fill="#0F172A" stroke="#020617" stroke-width="3" stroke-linejoin="round" />
  <polygon points="25,32 19,16 34,24" fill="#F472B6" />

  <!-- Right Ear -->
  <polygon points="74,38 85,10 61,22" fill="#0F172A" stroke="#020617" stroke-width="3" stroke-linejoin="round" />
  <polygon points="75,32 81,16 66,24" fill="#F472B6" />

  <!-- Main Cat Head Shape (Tuxedo Black) -->
  <rect x="22" y="24" width="56" height="58" rx="18" fill="#0F172A" stroke="#020617" stroke-width="3.5" />

  <!-- Cheek Tufts (Signature Sylvester fur spikes) -->
  <polygon points="22,50 14,56 22,62" fill="#FFFFFF" stroke="#020617" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="78,50 86,56 78,62" fill="#FFFFFF" stroke="#020617" stroke-width="2.5" stroke-linejoin="round" />

  <!-- White Lower Face & Jowls -->
  <path d="M 22 52 C 22 76 36 82 50 82 C 64 82 78 76 78 52 C 78 44 68 46 50 48 C 32 46 22 44 22 52 Z" fill="#FFFFFF" stroke="#020617" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Expressive / Conniving Eyebrows -->
  <path d="M 30 33 Q 38 28 44 34" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 56 34 Q 62 28 70 33" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Tall Cartoony Cat Eyes -->
  <ellipse cx="38" cy="42" rx="6.5" ry="9" fill="#FFFFFF" stroke="#020617" stroke-width="2" />
  <circle cx="39.5" cy="42" r="3.2" fill="#0F172A" />
  <circle cx="38" cy="40" r="1.1" fill="#FFFFFF" />

  <ellipse cx="62" cy="42" rx="6.5" ry="9" fill="#FFFFFF" stroke="#020617" stroke-width="2" />
  <circle cx="60.5" cy="42" r="3.2" fill="#0F172A" />
  <circle cx="59" cy="40" r="1.1" fill="#FFFFFF" />

  <!-- Giant Shiny Red Clown/Cat Nose -->
  <circle cx="50" cy="53" r="8.5" fill="#EF4444" stroke="#020617" stroke-width="2.5" />
  <circle cx="47.5" cy="50.5" r="2.2" fill="#FFFFFF" opacity="0.8" />

  <!-- Muzzle Center Crease & Smirk -->
  <line x1="50" y1="61.5" x2="50" y2="67" stroke="#020617" stroke-width="2" stroke-linecap="round" />
  <path d="M 38 67 Q 50 75 62 67" fill="none" stroke="#020617" stroke-width="2.5" stroke-linecap="round" />

  <!-- Splotchy Whisker Freckles -->
  <circle cx="34" cy="62" r="1.3" fill="#020617" />
  <circle cx="31" cy="66" r="1.3" fill="#020617" />
  <circle cx="66" cy="62" r="1.3" fill="#020617" />
  <circle cx="69" cy="66" r="1.3" fill="#020617" />

  <!-- Whiskers -->
  <line x1="24" y1="63" x2="12" y2="61" stroke="#020617" stroke-width="1.8" stroke-linecap="round" />
  <line x1="24" y1="67" x2="13" y2="70" stroke="#020617" stroke-width="1.8" stroke-linecap="round" />
  <line x1="76" y1="63" x2="88" y2="61" stroke="#020617" stroke-width="1.8" stroke-linecap="round" />
  <line x1="76" y1="67" x2="87" y2="70" stroke="#020617" stroke-width="1.8" stroke-linecap="round" />
</svg>
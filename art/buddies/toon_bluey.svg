<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background glow / base circle for emoji badge framing -->
  <rect width="100" height="100" rx="24" fill="#E0F2FE" />
  
  <!-- Left Ear -->
  <polygon points="26,42 16,14 38,24" fill="#1E3A8A" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
  <polygon points="25,36 20,20 34,26" fill="#FDE047" />
  
  <!-- Right Ear -->
  <polygon points="74,42 84,14 62,24" fill="#1E3A8A" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
  <polygon points="75,36 80,20 66,26" fill="#FDE047" />

  <!-- Main Head / Body Block -->
  <rect x="22" y="24" width="56" height="58" rx="18" fill="#60A5FA" stroke="#0F172A" stroke-width="3.5" />

  <!-- Dark Blue Eye Mask Patch -->
  <!-- Left Eye Patch -->
  <rect x="25" y="34" width="22" height="26" rx="8" fill="#2563EB" />
  <!-- Right Eye Patch -->
  <rect x="53" y="34" width="22" height="26" rx="8" fill="#2563EB" />

  <!-- Eyebrows -->
  <rect x="28" y="30" width="14" height="4.5" rx="2" fill="#BAE6FD" />
  <rect x="58" y="30" width="14" height="4.5" rx="2" fill="#BAE6FD" />

  <!-- Eyes -->
  <ellipse cx="36" cy="46" rx="6" ry="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
  <circle cx="37" cy="46" r="3.5" fill="#0F172A" />
  <circle cx="35" cy="44" r="1.2" fill="#FFFFFF" />

  <ellipse cx="64" cy="46" rx="6" ry="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
  <circle cx="63" cy="46" r="3.5" fill="#0F172A" />
  <circle cx="61" cy="44" r="1.2" fill="#FFFFFF" />

  <!-- Snout / Muzzle Area -->
  <rect x="30" y="52" width="40" height="26" rx="12" fill="#FDE047" stroke="#0F172A" stroke-width="2.5" />
  
  <!-- Nose -->
  <ellipse cx="50" cy="58" rx="7" ry="5" fill="#1E293B" />
  <ellipse cx="48.5" cy="56.5" rx="2" ry="1.2" fill="#94A3B8" />

  <!-- Smile -->
  <path d="M 44 67 Q 50 72 56 67" fill="transparent" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
</svg>
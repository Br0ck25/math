<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <rect width="100" height="100" rx="24" fill="#FEF9C3" />

  <!-- Sponge Body -->
  <rect x="18" y="16" width="64" height="66" rx="14" fill="#FACC15" stroke="#713F12" stroke-width="3.5" />

  <!-- Sponge Pores / Dents -->
  <circle cx="26" cy="25" r="3.5" fill="#CA8A04" opacity="0.65" />
  <circle cx="74" cy="27" r="4.5" fill="#CA8A04" opacity="0.65" />
  <circle cx="24" cy="58" r="3" fill="#CA8A04" opacity="0.65" />
  <circle cx="76" cy="56" r="3.5" fill="#CA8A04" opacity="0.65" />

  <!-- Eyelashes -->
  <line x1="31" y1="23" x2="31" y2="28" stroke="#713F12" stroke-width="2" stroke-linecap="round" />
  <line x1="37" y1="21" x2="37" y2="27" stroke="#713F12" stroke-width="2" stroke-linecap="round" />
  <line x1="43" y1="23" x2="43" y2="28" stroke="#713F12" stroke-width="2" stroke-linecap="round" />

  <line x1="57" y1="23" x2="57" y2="28" stroke="#713F12" stroke-width="2" stroke-linecap="round" />
  <line x1="63" y1="21" x2="63" y2="27" stroke="#713F12" stroke-width="2" stroke-linecap="round" />
  <line x1="69" y1="23" x2="69" y2="28" stroke="#713F12" stroke-width="2" stroke-linecap="round" />

  <!-- Big Eyes -->
  <circle cx="37" cy="38" r="11" fill="#FFFFFF" stroke="#713F12" stroke-width="2.5" />
  <circle cx="63" cy="38" r="11" fill="#FFFFFF" stroke="#713F12" stroke-width="2.5" />

  <!-- Irises & Pupils -->
  <circle cx="39" cy="38" r="5" fill="#38BDF8" />
  <circle cx="39" cy="38" r="2.5" fill="#0F172A" />
  <circle cx="37.5" cy="36.5" r="1" fill="#FFFFFF" />

  <circle cx="61" cy="38" r="5" fill="#38BDF8" />
  <circle cx="61" cy="38" r="2.5" fill="#0F172A" />
  <circle cx="59.5" cy="36.5" r="1" fill="#FFFFFF" />

  <!-- Cute Nose -->
  <path d="M 50 36 C 54 36 54 45 49 45" fill="none" stroke="#713F12" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cheeks with Freckles -->
  <circle cx="28" cy="46" r="4" fill="#F87171" opacity="0.4" />
  <circle cx="72" cy="46" r="4" fill="#F87171" opacity="0.4" />

  <!-- Big Grin -->
  <path d="M 32 48 Q 50 63 68 48" fill="#713F12" stroke="#713F12" stroke-width="2" />

  <!-- Two Front Teeth -->
  <rect x="44" y="52" width="5" height="5.5" rx="1" fill="#FFFFFF" stroke="#713F12" stroke-width="1.2" />
  <rect x="51" y="52" width="5" height="5.5" rx="1" fill="#FFFFFF" stroke="#713F12" stroke-width="1.2" />

  <!-- Shirt Collar & Red Tie -->
  <rect x="22" y="73" width="56" height="9" fill="#FFFFFF" stroke="#713F12" stroke-width="2" />
  <polygon points="46,74 54,74 52,81 48,81" fill="#EF4444" />
  <polygon points="48,81 52,81 55,87 50,90 45,87" fill="#EF4444" />
</svg>
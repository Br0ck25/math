<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <!-- Left Ear -->
  <polygon points="26,42 16,14 38,24" fill="#64748B" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="25,36 20,20 34,26" fill="#F8FAFC"/>
  <!-- Right Ear -->
  <polygon points="74,42 84,14 62,24" fill="#64748B" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="75,36 80,20 66,26" fill="#F8FAFC"/>
  <!-- Main Body / Head Block (Muffin Pale Slate Gray) -->
  <rect x="22" y="24" width="56" height="58" rx="18" fill="#CBD5E1" stroke="#0F172A" stroke-width="3.5"/>
  <!-- Muffin Dark Slate Eye Patches (Both sides) -->
  <rect x="25" y="33" width="22" height="28" rx="8" fill="#475569"/>
  <rect x="53" y="33" width="22" height="28" rx="8" fill="#475569"/>
  <!-- Eyebrows (Slightly tilted up/chaotic) -->
  <rect x="28" y="29" width="13" height="4.5" rx="2" fill="#F8FAFC" transform="rotate(-6 34 31)"/>
  <rect x="59" y="29" width="13" height="4.5" rx="2" fill="#F8FAFC" transform="rotate(6 65 31)"/>
  <!-- Large Wide Eyes -->
  <ellipse cx="36" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <circle cx="36" cy="46" r="3.5" fill="#0F172A"/>
  <circle cx="34" cy="44" r="1.2" fill="#FFFFFF"/>
  <ellipse cx="64" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <circle cx="64" cy="46" r="3.5" fill="#0F172A"/>
  <circle cx="62" cy="44" r="1.2" fill="#FFFFFF"/>
  <!-- White / Off-White Snout & Muzzle Area -->
  <rect x="30" y="52" width="40" height="26" rx="12" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5"/>
  <!-- Dog Nose -->
  <ellipse cx="50" cy="58" rx="7" ry="5" fill="#0F172A"/>
  <ellipse cx="48.5" cy="56.5" rx="2" ry="1.2" fill="#94A3B8"/>
  <!-- High-Energy / Cheeky Open Smile with Tongue -->
  <path d="M 42 66 Q 50 75 58 66" fill="#881337" stroke="#0F172A" stroke-width="2"/>
  <path d="M 46 70 Q 50 67 54 70" fill="#FB7185"/>
</svg>
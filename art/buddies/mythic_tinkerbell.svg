<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pointed Pixie Ears -->
  <!-- Left Ear -->
  <polygon points="26,44 10,32 24,56" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="24,44 14,35 23,52" fill="#FDBA74" />

  <!-- Right Ear -->
  <polygon points="74,44 90,32 76,56" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="76,44 86,35 77,52" fill="#FDBA74" />

  <!-- High Pixie Topknot / Bun -->
  <ellipse cx="50" cy="11" rx="14" ry="9" fill="#FACC15" stroke="#1E293B" stroke-width="3" stroke-linejoin="round" />
  <ellipse cx="50" cy="11" rx="9" ry="5.5" fill="#FDE047" />
  <!-- Lime Green Ribbon Tie Around Bun -->
  <path d="M 40 18 Q 50 14 60 18 L 61 21 Q 50 17 39 21 Z" fill="#84CC16" stroke="#65A30D" stroke-width="1.2" />

  <!-- Blonde Hair (Back Silhouette) -->
  <path d="
    M 22 44 
    C 14 26 18 12 36 8 
    C 44 6 56 6 64 8 
    C 82 12 86 26 78 44 
    C 84 56 82 72 78 82 
    L 22 82 
    C 18 72 16 56 22 44 
    Z" fill="#FACC15" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Fair Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Signature Wispy Piecey Pixie Bangs -->
  <path d="
    M 21 34 
    Q 28 38 34 26 
    Q 42 42 50 28 
    Q 58 42 66 26 
    Q 72 36 79 32 
    L 79 24 
    Q 50 12 21 24 
    Z" fill="#FACC15" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Hair Highlights -->
  <path d="M 33 13 Q 38 22 34 27" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />
  <path d="M 63 13 Q 59 22 64 27" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />

  <!-- Arched Sassy Eyebrows -->
  <path d="M 28 37 Q 36 30 44 36" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 56 36 Q 64 30 72 37" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" />

  <!-- Winged Eyelashes & Upper Lid Line -->
  <!-- Left Eye Lashes -->
  <path d="M 28 42 Q 37 38 45 42" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="28" y1="42" x2="24" y2="38" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="33" y1="40" x2="30" y2="36" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Right Eye Lashes -->
  <path d="M 55 42 Q 63 38 72 42" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="72" y1="42" x2="76" y2="38" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="67" y1="40" x2="70" y2="36" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Big Bright Cyan/Aqua Blue Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="47" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="47" r="4.4" fill="#06B6D4" />
  <circle cx="38.5" cy="47" r="2.2" fill="#0F172A" />
  <circle cx="36.6" cy="44.8" r="1.2" fill="#FFFFFF" />
  <circle cx="39.8" cy="48.5" r="0.7" fill="#67E8F9" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="47" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="47" r="4.4" fill="#06B6D4" />
  <circle cx="61.5" cy="47" r="2.2" fill="#0F172A" />
  <circle cx="59.6" cy="44.8" r="1.2" fill="#FFFFFF" />
  <circle cx="62.8" cy="48.5" r="0.7" fill="#67E8F9" />

  <!-- Petite Upturned Nose -->
  <path d="M 48 55 Q 50 58 53 56" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

  <!-- Rosy Pixie Blush -->
  <circle cx="28" cy="57" r="4.5" fill="#FB7185" opacity="0.4" />
  <circle cx="72" cy="57" r="4.5" fill="#FB7185" opacity="0.4" />

  <!-- Sassy / Playful Smirk -->
  <path d="M 40 66 Q 50 74 61 66" fill="none" stroke="#E11D48" stroke-width="2.6" stroke-linecap="round" />

  <!-- Leaf Dress Sweetheart Bodice & Pixie Dust Base -->
  <g>
    <!-- Leaf-Green Bodice Fold -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#84CC16" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Sweetheart Leaf Center Notch -->
    <path d="M 32 82 Q 41 86 50 83 Q 59 86 68 82" fill="none" stroke="#65A30D" stroke-width="1.6" />
    <!-- Golden Pixie Dust Sparkles -->
    <polygon points="50,83 51,81 52,83 54,84 52,85 51,87 50,85 48,84" fill="#FEF08A" />
    <circle cx="40" cy="85" r="1" fill="#FEF08A" />
    <circle cx="60" cy="85" r="1" fill="#FEF08A" />
  </g>
</svg>
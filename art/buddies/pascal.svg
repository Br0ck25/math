<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Chameleon Crest / Casque Ridges (Crown) -->
  <path d="
    M 34 22 
    Q 40 12 50 12 
    Q 60 12 66 22 
    Z" fill="#16A34A" stroke="#14532D" stroke-width="3" stroke-linejoin="round" />
  <path d="M 42 16 Q 50 14 58 16" fill="none" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round" />

  <!-- Turret Eye Domes (Bulging Chamaleon Orbits) -->
  <!-- Left Turret -->
  <circle cx="34" cy="45" r="15" fill="#16A34A" stroke="#14532D" stroke-width="3" />
  <circle cx="34" cy="45" r="12" fill="#22C55E" />
  
  <!-- Right Turret -->
  <circle cx="66" cy="45" r="15" fill="#16A34A" stroke="#14532D" stroke-width="3" />
  <circle cx="66" cy="45" r="12" fill="#22C55E" />

  <!-- Main Head Squircle Base (Vibrant Chameleon Green) -->
  <rect x="22" y="24" width="56" height="56" rx="20" fill="#22C55E" stroke="#14532D" stroke-width="3.5" />

  <!-- Sassy / Expressive Chameleon Brow Ridges -->
  <path d="M 23 35 Q 34 29 44 37" fill="none" stroke="#14532D" stroke-width="3" stroke-linecap="round" />
  <path d="M 77 35 Q 66 29 56 37" fill="none" stroke="#14532D" stroke-width="3" stroke-linecap="round" />

  <!-- Turret Ring Highlights -->
  <path d="M 25 43 Q 27 35 35 34" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" />
  <path d="M 75 43 Q 73 35 65 34" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" />

  <!-- Big Independent Chameleon Eyes (Dark Amber/Brown Pupils) -->
  <!-- Left Eye -->
  <circle cx="34" cy="46" r="7.5" fill="#854D0E" stroke="#14532D" stroke-width="2" />
  <circle cx="35" cy="46" r="4.2" fill="#0F172A" />
  <circle cx="33" cy="43.5" r="1.3" fill="#FFFFFF" />

  <!-- Right Eye -->
  <circle cx="66" cy="46" r="7.5" fill="#854D0E" stroke="#14532D" stroke-width="2" />
  <circle cx="65" cy="46" r="4.2" fill="#0F172A" />
  <circle cx="63.5" cy="43.5" r="1.3" fill="#FFFFFF" />

  <!-- Snout / Nostril Indentations -->
  <circle cx="45" cy="54" r="1.2" fill="#14532D" />
  <circle cx="55" cy="54" r="1.2" fill="#14532D" />

  <!-- Cheek Color Accent Scales / Rosy Spots -->
  <ellipse cx="26" cy="61" rx="3.5" ry="2.5" fill="#4ADE80" stroke="#16A34A" stroke-width="1.2" />
  <ellipse cx="74" cy="61" rx="3.5" ry="2.5" fill="#4ADE80" stroke="#16A34A" stroke-width="1.2" />

  <!-- Broad Smug / Sassy Chameleon Mouth Line -->
  <path d="M 30 63 Q 50 76 70 63" fill="none" stroke="#14532D" stroke-width="3.2" stroke-linecap="round" />
  <!-- Corner Lip Smirk Notches -->
  <path d="M 29 61 Q 30 63 32 64" fill="none" stroke="#14532D" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 71 61 Q 70 63 68 64" fill="none" stroke="#14532D" stroke-width="2.5" stroke-linecap="round" />

  <!-- Chin Crease & Throat Scales Base -->
  <path d="M 42 73 Q 50 77 58 73" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" />

  <!-- Throat / Neck Collar Contour -->
  <g>
    <path d="M 32 80 Q 50 86 68 80 L 68 88 Q 50 94 32 88 Z" fill="#16A34A" stroke="#14532D" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Pale Lime Throat Segment Scales -->
    <path d="M 40 82 Q 50 86 60 82" fill="none" stroke="#BBF7D0" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
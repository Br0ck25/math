<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pointed Pig Ears with Pink Inners -->
  <!-- Left Ear -->
  <polygon points="26,36 18,14 36,24" fill="#FBCFE8" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
  <polygon points="25,32 21,19 32,25" fill="#F472B6" />

  <!-- Right Ear -->
  <polygon points="74,36 82,14 64,24" fill="#FBCFE8" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
  <polygon points="75,32 79,19 68,25" fill="#F472B6" />

  <!-- Blue Jacket Collar / Shoulders -->
  <path d="M 24 88 L 30 76 Q 50 82 70 76 L 76 88 Z" fill="#2563EB" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Red Bow Tie -->
  <polygon points="50,78 40,73 40,85" fill="#EF4444" stroke="#0F172A" stroke-width="2" stroke-linejoin="round" />
  <polygon points="50,78 60,73 60,85" fill="#EF4444" stroke="#0F172A" stroke-width="2" stroke-linejoin="round" />
  <circle cx="50" cy="78" r="3" fill="#DC2626" stroke="#0F172A" stroke-width="1.5" />

  <!-- Round Pig Head & Chubby Jowls (Soft Pale Pink) -->
  <path d="M 50 20 C 30 20 22 34 22 52 C 22 72 32 80 50 80 C 68 80 78 72 78 52 C 78 34 70 20 50 20 Z" fill="#FBCFE8" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Cheerful Raised Eyebrows -->
  <path d="M 32 32 Q 38 27 44 32" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 56 32 Q 62 27 68 32" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Big Wide Cartoon Eyes -->
  <ellipse cx="38" cy="43" rx="6.5" ry="9" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
  <circle cx="39.5" cy="43" r="3.2" fill="#0F172A" />
  <circle cx="38" cy="41" r="1.1" fill="#FFFFFF" />

  <ellipse cx="62" cy="43" rx="6.5" ry="9" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
  <circle cx="60.5" cy="43" r="3.2" fill="#0F172A" />
  <circle cx="59" cy="41" r="1.1" fill="#FFFFFF" />

  <!-- Rosy Cheeks -->
  <circle cx="26" cy="56" r="4.5" fill="#F472B6" opacity="0.5" />
  <circle cx="74" cy="56" r="4.5" fill="#F472B6" opacity="0.5" />

  <!-- Oval Pig Snout -->
  <ellipse cx="50" cy="54" rx="13" ry="9" fill="#F472B6" stroke="#0F172A" stroke-width="2.5" />

  <!-- Nostrils -->
  <ellipse cx="46" cy="54" rx="2.2" ry="3.2" fill="#9D174D" />
  <ellipse cx="54" cy="54" rx="2.2" ry="3.2" fill="#9D174D" />

  <!-- Friendly Open Grin with Tongue -->
  <path d="M 42 66 Q 50 76 58 66" fill="#881337" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 45 70 Q 50 67 55 70" fill="#FB7185" />
</svg>
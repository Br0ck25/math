<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#D97706" stroke="#1E293B" stroke-width="2.5" />
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#D97706" stroke="#1E293B" stroke-width="2.5" />

  <!-- Thick Curly Dark Brown Hair (Back/Volume) -->
  <path d="
    M 20 44 
    C 10 24 16 8 36 6 
    C 44 4 56 4 64 6 
    C 84 8 90 24 80 44 
    C 90 58 88 78 82 86 
    L 18 86 
    C 12 78 10 58 20 44 
    Z" fill="#292524" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Red Plumeria Flower Behind Right Ear -->
  <g>
    <!-- Petals -->
    <ellipse cx="78" cy="27" rx="3.5" ry="5.5" transform="rotate(-15 78 27)" fill="#EF4444" stroke="#991B1B" stroke-width="1.2" />
    <ellipse cx="83" cy="33" rx="3.5" ry="5.5" transform="rotate(55 83 33)" fill="#F87171" stroke="#991B1B" stroke-width="1.2" />
    <ellipse cx="80" cy="40" rx="3.5" ry="5.5" transform="rotate(130 80 40)" fill="#EF4444" stroke="#991B1B" stroke-width="1.2" />
    <ellipse cx="73" cy="38" rx="3.5" ry="5.5" transform="rotate(-150 73 38)" fill="#F87171" stroke="#991B1B" stroke-width="1.2" />
    <ellipse cx="72" cy="30" rx="3.5" ry="5.5" transform="rotate(-75 72 30)" fill="#EF4444" stroke="#991B1B" stroke-width="1.2" />
    <!-- Yellow Center -->
    <circle cx="77" cy="34" r="2.2" fill="#FACC15" stroke="#CA8A04" stroke-width="0.8" />
  </g>

  <!-- Main Head Squircle Base (Warm Polynesian Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#D97706" stroke="#1E293B" stroke-width="3.5" />

  <!-- Voluminous Curly Wavy Fringe / Front Strands -->
  <path d="
    M 21 34 
    Q 28 38 34 26 
    Q 42 42 49 28 
    Q 57 42 65 26 
    Q 73 36 79 32 
    L 79 24 
    Q 50 12 21 24 
    Z" fill="#292524" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Hair Curls / Wavy Texture Highlights -->
  <path d="M 33 12 Q 38 22 34 28" fill="none" stroke="#44403C" stroke-width="2" stroke-linecap="round" />
  <path d="M 48 10 Q 52 20 48 26" fill="none" stroke="#44403C" stroke-width="2" stroke-linecap="round" />
  <path d="M 64 12 Q 60 22 65 28" fill="none" stroke="#44403C" stroke-width="2" stroke-linecap="round" />

  <!-- Strong Natural Dark Eyebrows -->
  <path d="M 28 38 Q 36 33 44 38" fill="none" stroke="#1C1917" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 56 38 Q 64 33 72 38" fill="none" stroke="#1C1917" stroke-width="2.8" stroke-linecap="round" />

  <!-- Eyelashes / Eye Contours -->
  <!-- Left Eye Lashes -->
  <path d="M 28 43 Q 37 39 45 43" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" />
  <line x1="28" y1="43" x2="25" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="33" y1="41" x2="31" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Right Eye Lashes -->
  <path d="M 55 43 Q 63 39 72 43" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" />
  <line x1="72" y1="43" x2="75" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="67" y1="41" x2="69" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Warm Deep Brown Expressive Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="4.4" fill="#451A03" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="36.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="39.8" cy="49.5" r="0.7" fill="#78350F" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="48" r="4.4" fill="#451A03" />
  <circle cx="61.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="59.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="62.8" cy="49.5" r="0.7" fill="#78350F" />

  <!-- Soft Rounded Button Nose -->
  <path d="M 47 56 Q 50 60 53 57" fill="none" stroke="#92400E" stroke-width="2.2" stroke-linecap="round" />

  <!-- Warm Sun-Kissed Cheek Blush -->
  <circle cx="28" cy="58" r="4.5" fill="#B45309" opacity="0.35" />
  <circle cx="72" cy="58" r="4.5" fill="#B45309" opacity="0.35" />

  <!-- Determined, Warm Smile -->
  <path d="M 39 67 Q 50 75 61 67" fill="none" stroke="#991B1B" stroke-width="2.6" stroke-linecap="round" />

  <!-- Heart of Te Fiti Oceanic Pendant & Coral Tapa Collar Base -->
  <g>
    <!-- Coral / Crimson Top Band -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#EA580C" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Shell Pearl Beaded Cord -->
    <path d="M 38 81 Q 50 87 62 81" fill="none" stroke="#FDE68A" stroke-width="1.8" stroke-dasharray="2,2" />
    <!-- Heart of Te Fiti Locket Shell -->
    <ellipse cx="50" cy="86" rx="4.5" ry="4" fill="#0284C7" stroke="#1E293B" stroke-width="1.4" />
    <!-- Te Fiti Spiral Swirl -->
    <circle cx="50" cy="86" r="2" fill="#10B981" />
    <path d="M 49.5 86 Q 50.5 85.5 50.5 86.5" fill="none" stroke="#A7F3D0" stroke-width="0.8" stroke-linecap="round" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <!-- Left Eyestalk -->
  <path d="M 40 46 L 40 18" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/>
  <!-- Right Eyestalk -->
  <path d="M 60 46 L 60 18" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/>
  <!-- Tall Stalk Eyes -->
  <ellipse cx="40" cy="20" rx="7.5" ry="12" fill="#FFFFFF" stroke="#991B1B" stroke-width="2.5"/>
  <ellipse cx="60" cy="20" rx="7.5" ry="12" fill="#FFFFFF" stroke="#991B1B" stroke-width="2.5"/>
  <!-- Eyelashes / Ridges -->
  <line x1="33" y1="14" x2="28" y2="12" stroke="#991B1B" stroke-width="2" stroke-linecap="round"/>
  <line x1="33" y1="19" x2="27" y2="19" stroke="#991B1B" stroke-width="2" stroke-linecap="round"/>
  <line x1="67" y1="14" x2="72" y2="12" stroke="#991B1B" stroke-width="2" stroke-linecap="round"/>
  <line x1="67" y1="19" x2="73" y2="19" stroke="#991B1B" stroke-width="2" stroke-linecap="round"/>
  <!-- Black Pupils -->
  <circle cx="41" cy="20" r="3.2" fill="#0F172A"/>
  <circle cx="39.5" cy="18.5" r="1.1" fill="#FFFFFF"/>
  <circle cx="59" cy="20" r="3.2" fill="#0F172A"/>
  <circle cx="57.5" cy="18.5" r="1.1" fill="#FFFFFF"/>
  <!-- Claws behind / peeking from sides -->
  <!-- Left Claw -->
  <circle cx="17" cy="46" r="10" fill="#DC2626" stroke="#991B1B" stroke-width="2.5"/>
  <path d="M 12 40 Q 18 46 25 43" fill="none" stroke="#991B1B" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right Claw -->
  <circle cx="83" cy="46" r="10" fill="#DC2626" stroke="#991B1B" stroke-width="2.5"/>
  <path d="M 88 40 Q 82 46 75 43" fill="none" stroke="#991B1B" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Crab Head / Body -->
  <path d="M 22 56 C 22 42 78 42 78 56 C 78 72 70 82 50 82 C 30 82 22 72 22 56 Z" fill="#EF4444" stroke="#991B1B" stroke-width="3"/>
  <!-- Craggy Wrinkle / Nose Bridge Spikes -->
  <polygon points="47,43 50,37 53,43" fill="#DC2626" stroke="#991B1B" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Wide Money-Loving Grin -->
  <path d="M 31 59 Q 50 75 69 59" fill="#7F1D1D" stroke="#991B1B" stroke-width="2.5"/>
  <!-- Teeth Ridges -->
  <path d="M 36 61 Q 50 67 64 61" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="43" y1="62" x2="43" y2="65" stroke="#7F1D1D" stroke-width="1.5"/>
  <line x1="50" y1="63" x2="50" y2="66" stroke="#7F1D1D" stroke-width="1.5"/>
  <line x1="57" y1="62" x2="57" y2="65" stroke="#7F1D1D" stroke-width="1.5"/>
  <!-- Light Blue Shirt & Collar -->
  <path d="M 28 80 L 22 88 L 78 88 L 72 80 Z" fill="#93C5FD" stroke="#1E3A8A" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="46,80 54,80 50,86" fill="#60A5FA"/>
  <!-- Black Belt with Golden Buckle -->
  <rect x="23" y="85" width="54" height="4" fill="#0F172A"/>
  <rect x="46" y="84" width="8" height="5.5" rx="1" fill="#FACC15" stroke="#78350F" stroke-width="1"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Long Rabbit Ears (Tilted back in signature Peppa Pig silhouette) -->
  <path d="M 52 26 C 50 4 60 4 62 24 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="3" stroke-linejoin="round" />
  <path d="M 64 28 C 62 6 72 6 74 26 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Inner Ears (Soft Pink) -->
  <path d="M 54 23 C 53 9 58 9 60 21 Z" fill="#FCE7F3" />
  <path d="M 66 25 C 65 11 70 11 72 23 Z" fill="#FCE7F3" />

  <!-- Rebecca's Turquoise / Sea Green Dress (Bottom Base) -->
  <path d="M 28 88 L 36 68 Q 50 64 64 68 L 72 88 Z" fill="#2DD4BF" stroke="#0F766E" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Rabbit Head & Snout Silhouette (Pale Sandy Cream) -->
  <path d="M 22 36 C 22 30 27 28 32 30 L 52 38 C 68 28 84 38 84 54 C 84 72 64 78 46 72 C 34 68 28 56 34 46 L 24 44 C 22 43 22 39 22 36 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Snout Tip Oval Disc -->
  <ellipse cx="23" cy="38" rx="4.5" ry="7.5" fill="#FEF3C7" stroke="#D97706" stroke-width="3" />

  <!-- Snout Nostrils -->
  <circle cx="22" cy="35" r="1.3" fill="#D97706" />
  <circle cx="22" cy="41" r="1.3" fill="#D97706" />

  <!-- Large Stylized Eyes (Both on top profile) -->
  <!-- Left Eye -->
  <circle cx="48" cy="33" r="6.5" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5" />
  <circle cx="48" cy="33" r="2.3" fill="#0F172A" />
  <circle cx="47" cy="31.8" r="0.8" fill="#FFFFFF" />

  <!-- Right Eye -->
  <circle cx="61" cy="36" r="6.5" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5" />
  <circle cx="61" cy="36" r="2.3" fill="#0F172A" />
  <circle cx="60" cy="34.8" r="0.8" fill="#FFFFFF" />

  <!-- Soft Pink Cheek Circle -->
  <circle cx="64" cy="56" r="8" fill="#FBCFE8" stroke="#F472B6" stroke-width="1.5" opacity="0.85" />

  <!-- Whiskers -->
  <line x1="17" y1="36" x2="11" y2="34" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" />
  <line x1="17" y1="40" x2="11" y2="42" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" />

  <!-- Curved Grin & Signature Rabbit Buck Teeth -->
  <path d="M 38 54 Q 46 64 54 55" fill="none" stroke="#D97706" stroke-width="2.8" stroke-linecap="round" />
  <rect x="44" y="58" width="3.2" height="4.5" rx="0.8" fill="#FFFFFF" stroke="#D97706" stroke-width="1" />
  <rect x="47.8" y="58" width="3.2" height="4.5" rx="0.8" fill="#FFFFFF" stroke="#D97706" stroke-width="1" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Triple Head Crest / Plumes (Deep Royal Blue) -->
  <path d="M 40 28 C 30 14 42 6 48 18 C 50 10 62 8 60 20 C 66 12 76 16 68 26 Z" fill="#1D4ED8" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />

  <!-- Slender Bird Neck -->
  <path d="M 44 68 L 42 88 L 58 88 L 56 68 Z" fill="#38BDF8" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />

  <!-- Sleek Blue Head Block -->
  <rect x="28" y="26" width="44" height="46" rx="16" fill="#38BDF8" stroke="#0F172A" stroke-width="3.5" />

  <!-- High-Energy Curved Eyebrow Ridge -->
  <path d="M 33 34 Q 42 28 50 34" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Giant Alert Eyes -->
  <!-- Left Eye -->
  <ellipse cx="40" cy="43" rx="7.5" ry="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
  <circle cx="41.5" cy="43" r="3.4" fill="#0F172A" />
  <circle cx="39.8" cy="40.8" r="1.2" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="58" cy="43" rx="7" ry="9.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
  <circle cx="58" cy="43" r="3.2" fill="#0F172A" />
  <circle cx="56.5" cy="41" r="1.1" fill="#FFFFFF" />

  <!-- Cheerful Yellow/Orange Road Runner Beak -->
  <path d="M 32 54 C 20 54 12 59 12 63 C 12 66 22 68 36 67 L 64 67 C 76 67 84 64 84 60 C 84 56 74 54 60 54 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="2.8" stroke-linejoin="round" />

  <!-- Beak Smile Crease ("Beep Beep!") -->
  <path d="M 22 62 Q 48 67 76 60" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

  <!-- Open Lower Beak Curve -->
  <path d="M 36 67 C 36 74 60 74 60 67" fill="#EAB308" stroke="#CA8A04" stroke-width="2" stroke-linejoin="round" />
  <path d="M 42 68 Q 48 72 54 68" fill="#FB7185" />

  <!-- Speed Motion Accents -->
  <line x1="82" y1="46" x2="90" y2="46" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" />
  <line x1="85" y1="52" x2="94" y2="52" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />

  <!-- Golden Blonde Shoulder-Length Regal Hair (Back Silhouette) -->
  <path d="
    M 20 44 

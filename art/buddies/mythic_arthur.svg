    C 44 6 56 6 66 8 
    C 84 12 90 26 80 44 
    C 88 58 86 76 80 84 
    L 20 84 
    C 14 76 12 58 20 44 
    Z" fill="#EAB308" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Fair Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Golden Crown of Camelot -->
  <!-- Crown Base & Fleur Peaks -->
  <path d="
    M 24 30 
    L 22 14 
    L 34 22 
    L 50 10 
    L 66 22 
    L 78 14 
    L 76 30 
    Q 50 24 24 30 
    Z" fill="#FACC15" stroke="#1E293B" stroke-width="3" stroke-linejoin="round" />

  <!-- Crown Circlet Rim Band -->
  <path d="M 24 28 Q 50 23 76 28 L 76 32 Q 50 27 24 32 Z" fill="#CA8A04" />

  <!-- Crown Jewels (Ruby Center, Emerald Accents) -->
  <circle cx="50" cy="20" r="2.8" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
  <circle cx="34" cy="23" r="2" fill="#16A34A" stroke="#14532D" stroke-width="0.8" />
  <circle cx="66" cy="23" r="2" fill="#16A34A" stroke="#14532D" stroke-width="0.8" />
  <circle cx="50" cy="29" r="1.4" fill="#38BDF8" />

  <!-- Golden Forehead Fringe / Bangs Flowing Under Crown -->

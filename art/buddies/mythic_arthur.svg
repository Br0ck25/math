  <!-- Hair Texture Lines -->
  <path d="M 23 48 Q 21 60 23 68" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />
  <path d="M 77 48 Q 79 60 77 68" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

  <!-- Noble / Determined Eyebrows -->
  <path d="M 28 40 Q 36 34 44 39" fill="none" stroke="#854D0E" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 56 39 Q 64 34 72 40" fill="none" stroke="#854D0E" stroke-width="2.8" stroke-linecap="round" />

  <!-- Resolute Blue Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="4.2" fill="#0284C7" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="36.8" cy="46" r="1.1" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="48" rx="8" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="48" r="4.2" fill="#0284C7" />
  <circle cx="61.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="59.8" cy="46" r="1.1" fill="#FFFFFF" />

  <!-- Chiseled Regal Nose -->
  <path d="M 49 48 L 52 55 L 48 57 L 52 58" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" />

  <!-- Trimmed Golden-Blonde Beard & Mustache -->
  <!-- Mustache -->
  <path d="M 40 62 Q 50 67 60 62" fill="none" stroke="#CA8A04" stroke-width="3" stroke-linecap="round" />
  <!-- Short Chin Beard Contour -->
  <path d="M 42 69 Q 50 78 58 69" fill="#EAB308" stroke="#CA8A04" stroke-width="2" stroke-linejoin="round" />

  <!-- Confident Monarch Smile -->
  <path d="M 42 64 Q 50 69 58 64" fill="none" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" />

  <!-- Chainmail Coif & Royal Crimson/Gold Tunic Collar Base -->
  <g>
    <!-- Royal Tunic Fold -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#991B1B" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Chainmail Peek Trim (Steel Slate Links) -->
    <path d="M 32 78 Q 50 83 68 78 L 70 81 Q 50 86 30 81 Z" fill="#94A3B8" stroke="#1E293B" stroke-width="1.2" />
    <!-- Gold Trim Border -->
    <path d="M 28 82 Q 50 88 72 82" fill="none" stroke="#FACC15" stroke-width="1.8" />
    <!-- Pendant / Crest Accent -->
    <polygon points="50,83 48,86 50,89 52,86" fill="#FACC15" stroke="#CA8A04" stroke-width="0.8" />
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pointed Fluffy Cat Ears with White Ear Tufts -->
  <!-- Left Ear -->
  <polygon points="26,36 15,12 38,22" fill="#0F172A" stroke="#020617" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 24 30 Q 28 20 22 17 Q 32 22 34 26" fill="#F8FAFC"/>

  <!-- Right Ear -->
  <polygon points="74,36 85,12 62,22" fill="#0F172A" stroke="#020617" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 76 30 Q 72 20 78 17 Q 68 22 66 26" fill="#F8FAFC"/>

  <!-- White Fluffy Paws (Tucked at Bottom) -->
  <ellipse cx="40" cy="88" rx="8" ry="6.5" fill="#FFFFFF" stroke="#020617" stroke-width="2.5"/>
  <ellipse cx="60" cy="88" rx="8" ry="6.5" fill="#FFFFFF" stroke="#020617" stroke-width="2.5"/>
  <line x1="37" y1="86" x2="37" y2="92" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="43" y1="86" x2="43" y2="92" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="57" y1="86" x2="57" y2="92" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="63" y1="86" x2="63" y2="92" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Main Tuxedo Head Shape (Black) -->
  <rect x="22" y="24" width="56" height="56" rx="20" fill="#0F172A" stroke="#020617" stroke-width="3.5"/>

  <!-- Fluffy White Chest / Mane (Signature Longhair Tuxedo Bib) -->
  <path d="M 22 56 C 14 62 16 78 26 84 C 36 88 44 82 50 84 C 56 82 64 88 74 84 C 84 78 86 62 78 56 C 72 64 64 68 50 68 C 36 68 28 64 22 56 Z" fill="#FFFFFF" stroke="#020617" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Fluffy White Muzzle & Center Blaze -->
  <path d="M 33 55 C 33 48 42 48 47 52 L 50 49 L 53 52 C 58 48 67 48 67 55 C 67 66 59 71 50 71 C 41 71 33 66 33 55 Z" fill="#FFFFFF" stroke="#020617" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Calm / Unimpressed Almond Cat Eyes (Greenish-Gold) -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="43" rx="7" ry="6.5" fill="#FEF08A" stroke="#020617" stroke-width="2"/>
  <ellipse cx="37.5" cy="43" rx="2.4" ry="5.5" fill="#0F172A"/>
  <circle cx="36" cy="41" r="1" fill="#FFFFFF"/>
  <!-- Droopy Eyelid for that gentle sleepy/grumpy cat expression -->
  <path d="M 30 40 Q 37 38 44 41" fill="none" stroke="#020617" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right Eye -->
  <ellipse cx="63" cy="43" rx="7" ry="6.5" fill="#FEF08A" stroke="#020617" stroke-width="2"/>
  <ellipse cx="62.5" cy="43" rx="2.4" ry="5.5" fill="#0F172A"/>
  <circle cx="61" cy="41" r="1" fill="#FFFFFF"/>
  <path d="M 56 41 Q 63 38 70 40" fill="none" stroke="#020617" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Black Nose -->
  <polygon points="50,60 46,55 54,55" fill="#0F172A" stroke="#020617" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Cute Cat Mouth -->
  <path d="M 46 62 Q 50 65 54 62" fill="none" stroke="#020617" stroke-width="2" stroke-linecap="round"/>

  <!-- Prominent Long White Whiskers -->
  <!-- Left Whiskers -->
  <path d="M 34 58 Q 20 54 10 56" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 34 62 Q 22 62 12 66" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 35 65 Q 24 69 16 75" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right Whiskers -->
  <path d="M 66 58 Q 80 54 90 56" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 66 62 Q 78 62 88 66" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 65 65 Q 76 69 84 75" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
</svg>

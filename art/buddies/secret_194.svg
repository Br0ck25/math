<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <rect width="100" height="100" rx="24" fill="#FEF9C3" />

  <!-- English Bulldog Floppy Ears (Warm Brown) -->
  <!-- Left Ear -->
  <path d="M 27 38 C 14 44 13 65 19 75 C 23 80 30 79 33 72 C 35 66 33 50 31 40 Z" fill="#78350F" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
  <!-- Right Ear -->
  <path d="M 73 38 C 86 44 87 65 81 75 C 77 80 70 79 67 72 C 65 66 67 50 69 40 Z" fill="#78350F" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />

  <!-- Main Bulldog Head / Jowl Shape (Warm Brown) -->
  <rect x="20" y="24" width="60" height="58" rx="20" fill="#92400E" stroke="#451A03" stroke-width="3.5" />

  <!-- Yellow Construction Hard Hat Base / Dome -->
  <path d="M 22 32 C 22 13 78 13 78 32 Z" fill="#FACC15" stroke="#A16207" stroke-width="3" stroke-linejoin="round" />

  <!-- Hard Hat Visor / Brim -->
  <path d="M 16 32 Q 50 38 84 32 L 86 36 Q 50 43 14 36 Z" fill="#EAB308" stroke="#854D0E" stroke-width="1.5" />

  <!-- Hard Hat Central Crest / Ridge -->
  <path d="M 46 14 L 54 14 L 53 32 L 47 32 Z" fill="#CA8A04" opacity="0.6" />

  <!-- Construction Badge Emblem (Wrench Silhouette on Shield) -->
  <polygon points="50,15 58,20 56,28 50,32 44,28 42,20" fill="#FFFFFF" stroke="#854D0E" stroke-width="1" />
  <!-- Small Wrench Mark -->
  <path d="M 48 21 L 52 25 M 51 20 L 53 22 M 47 24 L 49 26" stroke="#451A03" stroke-width="1.5" stroke-linecap="round" />

  <!-- Left Eye Brown Patch Marking -->
  <circle cx="36" cy="46" r="11" fill="#78350F" />

  <!-- Chunky Bulldog Eyebrows -->
  <rect x="27" y="34" width="14" height="4.5" rx="2" fill="#451A03" />
  <rect x="59" y="34" width="14" height="4.5" rx="2" fill="#451A03" />

  <!-- Big Dark Brown Bulldog Eyes -->
  <ellipse cx="36" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#451A03" stroke-width="2" />
  <circle cx="37" cy="46" r="3.8" fill="#78350F" />
  <circle cx="37" cy="46" r="2.2" fill="#0F172A" />
  <circle cx="35" cy="43.5" r="1.3" fill="#FFFFFF" />

  <ellipse cx="64" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#451A03" stroke-width="2" />
  <circle cx="63" cy="46" r="3.8" fill="#78350F" />
  <circle cx="63" cy="46" r="2.2" fill="#0F172A" />
  <circle cx="61" cy="43.5" r="1.3" fill="#FFFFFF" />

  <!-- Broad Cream/White Bulldog Muzzle & Jowls -->
  <rect x="28" y="52" width="44" height="27" rx="14" fill="#FEF3C7" stroke="#451A03" stroke-width="2.5" />

  <!-- Wide Bulldog Nose -->
  <ellipse cx="50" cy="58" rx="8" ry="5.2" fill="#0F172A" />
  <ellipse cx="48" cy="56.5" rx="2.2" ry="1.2" fill="#64748B" />

  <!-- Bulldog Cheeks / Whisker Dots -->
  <circle cx="36" cy="65" r="1" fill="#78350F" />
  <circle cx="34" cy="69" r="1" fill="#78350F" />
  <circle cx="64" cy="65" r="1" fill="#78350F" />
  <circle cx="66" cy="69" r="1" fill="#78350F" />

  <!-- Cheerful Open Grin with Tiny Underbite Tooth -->
  <path d="M 42 67 Q 50 76 58 67" fill="#881337" stroke="#451A03" stroke-width="2" />
  <path d="M 46 71 Q 50 68 54 71" fill="#FB7185" />
  <polygon points="44,67 46,67 45,64" fill="#FFFFFF" stroke="#451A03" stroke-width="0.8" />
</svg>
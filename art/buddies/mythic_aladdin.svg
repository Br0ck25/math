<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears & Gold Stud on Left Ear -->
  <!-- Left Ear -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#D97706" stroke="#1E293B" stroke-width="2.5" />
  <circle cx="19" cy="57" r="1.8" fill="#FACC15" stroke="#CA8A04" stroke-width="1" />

  <!-- Right Ear -->
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#D97706" stroke="#1E293B" stroke-width="2.5" />

  <!-- Iconic Red Fez / Keffiyeh Cap (Tilted Left) -->
  <g transform="rotate(-12 36 18)">
    <polygon points="32,22 44,22 42,12 34,12" fill="#DC2626" stroke="#1E293B" stroke-width="2.4" stroke-linejoin="round" />
    <!-- Fez Dark Rim -->
    <line x1="31" y1="22" x2="45" y2="22" stroke="#991B1B" stroke-width="1.6" stroke-linecap="round" />
  </g>

  <!-- Thick Jet-Black Hair (Back Volume Silhouette) -->
  <path d="
    M 20 44 
    C 10 26 16 12 34 8 
    C 44 6 56 6 66 8 
    C 84 12 90 26 80 44 
    C 88 58 86 76 80 84 
    L 20 84 
    C 14 76 12 58 20 44 
    Z" fill="#18181B" stroke="#09090B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Warm Arabian Tan Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#D97706" stroke="#1E293B" stroke-width="3.5" />

  <!-- Signature Voluminous Sweeping Bangs with Center Hanging Lock -->
  <path d="
    M 21 34 
    Q 30 38 40 26 
    Q 45 42 49 46 
    Q 53 38 58 26 
    Q 68 38 79 34 
    L 79 24 
    Q 50 12 21 24 
    Z" fill="#18181B" stroke="#09090B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Hair Gloss Highlights -->
  <path d="M 33 14 Q 38 22 34 27" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" />
  <path d="M 63 14 Q 59 22 64 27" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" />

  <!-- Bold, Expressive Arched Eyebrows -->
  <path d="M 28 39 Q 36 33 44 38" fill="none" stroke="#09090B" stroke-width="3" stroke-linecap="round" />
  <path d="M 56 38 Q 64 33 72 39" fill="none" stroke="#09090B" stroke-width="3" stroke-linecap="round" />

  <!-- Warm Brown Expressive Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8.5" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="4.3" fill="#451A03" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="36.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="39.8" cy="49.5" r="0.7" fill="#78350F" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="48" rx="8.5" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="48" r="4.3" fill="#451A03" />
  <circle cx="61.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="59.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="62.8" cy="49.5" r="0.7" fill="#78350F" />

  <!-- Strong Defined Nose -->
  <path d="M 49 50 L 52 56 L 47 58 L 52 59" fill="none" stroke="#92400E" stroke-width="2.2" stroke-linecap="round" />

  <!-- Warm Cheek Glow -->
  <circle cx="28" cy="58" r="4.5" fill="#B45309" opacity="0.35" />
  <circle cx="72" cy="58" r="4.5" fill="#B45309" opacity="0.35" />

  <!-- Charming "Street Rat" Smirk / Grin -->
  <path d="M 39 67 Q 50 74 61 67" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 43 68 Q 50 72 57 68" fill="#FFFFFF" stroke="#1E293B" stroke-width="0.8" />

  <!-- Purple Vest & Open Chest Collar Base -->
  <g>
    <!-- Purple Vest Silhouette -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#7E22CE" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Deep Open V-Neck Chest Cutout -->
    <polygon points="50,88 38,80 62,80" fill="#D97706" stroke="#1E293B" stroke-width="1.8" stroke-linejoin="round" />
    <!-- Vest Lapel Stitch Lines -->
    <line x1="38" y1="80" x2="45" y2="88" stroke="#581C87" stroke-width="1.4" />
    <line x1="62" y1="80" x2="55" y2="88" stroke="#581C87" stroke-width="1.4" />
  </g>
</svg>
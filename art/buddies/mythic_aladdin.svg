  <path d="M 35 42 Q 41 38 47 42" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 65 41 Q 59 36 53 42" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round"/>


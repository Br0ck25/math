  <ellipse cx="41" cy="49" rx="5" ry="6" fill="#FFFFFF" stroke="#5B3A29" stroke-width="2"/>
  <circle cx="41.6" cy="50" r="3.3" fill="#3F2A1D"/>
  <circle cx="41.6" cy="50" r="1.8" fill="#0F172A"/>
  <circle cx="40.2" cy="48.4" r="1" fill="#FFFFFF"/>
  <ellipse cx="59" cy="49" rx="5" ry="6" fill="#FFFFFF" stroke="#5B3A29" stroke-width="2"/>
  <circle cx="58.4" cy="50" r="3.3" fill="#3F2A1D"/>
  <circle cx="58.4" cy="50" r="1.8" fill="#0F172A"/>
  <circle cx="57" cy="48.4" r="1" fill="#FFFFFF"/>


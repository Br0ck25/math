  <line x1="45" y1="48" x2="48" y2="48" stroke="#BE185D" stroke-width="2" stroke-linecap="round" />
  <line x1="36" y1="38" x2="36" y2="41" stroke="#BE185D" stroke-width="2" stroke-linecap="round" />
  <line x1="36" y1="55" x2="36" y2="58" stroke="#BE185D" stroke-width="2" stroke-linecap="round" />


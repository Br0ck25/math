  <line x1="52" y1="48" x2="55" y2="48" stroke="#BE185D" stroke-width="2" stroke-linecap="round" />
  <line x1="73" y1="48" x2="76" y2="48" stroke="#BE185D" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="38" x2="64" y2="41" stroke="#BE185D" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="55" x2="64" y2="58" stroke="#BE185D" stroke-width="2" stroke-linecap="round" />


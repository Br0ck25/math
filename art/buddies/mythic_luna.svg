    <!-- Scarf Base Fold -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#1D4ED8" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />

  <!-- Radish Earring (Beaded Dirigible Plum on Left Ear) -->
  <path d="M 19 60 L 19 63" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="19" cy="67" r="3.6" fill="#F43F5E" stroke="#9F1239" stroke-width="1.4" />
  <ellipse cx="19" cy="70" rx="1" ry="1.6" fill="#FFFFFF" />

  <!-- Long Dirty-Blonde / Pale Yellow Wavy Hair (Back) -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Left Ear & Blue Pom-pom Earring -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#D97706" stroke="#1E293B" stroke-width="2.5" />
  <circle cx="19" cy="64" r="3.2" fill="#0284C7" stroke="#1E293B" stroke-width="1.4" />

  <!-- Right Ear & Blue Pom-pom Earring -->
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#D97706" stroke="#1E293B" stroke-width="2.5" />
  <circle cx="81" cy="64" r="3.2" fill="#0284C7" stroke="#1E293B" stroke-width="1.4" />

  <!-- Voluminous Dark Curly Hair (Back Silhouette with Ringlets) -->
  <path d="
    M 20 44 
    C 10 24 16 8 36 6 
    C 44 4 56 4 64 6 
    C 84 8 90 24 80 44 
    C 90 58 88 78 82 86 
    L 18 86 
    C 12 78 10 58 20 44 
    Z" fill="#1C1917" stroke="#0C0A09" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Warm Colombian Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#D97706" stroke="#1E293B" stroke-width="3.5" />

  <!-- Asymmetrical Curly Fringe / Bouncy Ringlets -->
  <path d="
    M 21 34 
    Q 28 38 34 26 
    Q 42 42 50 28 
    Q 58 42 66 26 
    Q 74 36 79 32 
    L 79 24 
    Q 50 12 21 24 
    Z" fill="#1C1917" stroke="#0C0A09" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Curl Texture Accents -->
  <path d="M 32 14 Q 38 22 34 27" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round" />
  <path d="M 47 11 Q 51 21 47 27" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round" />
  <path d="M 63 13 Q 59 22 64 27" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round" />

  <!-- Expressive Dark Eyebrows -->
  <path d="M 28 39 Q 36 33 44 38" fill="none" stroke="#0C0A09" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 56 38 Q 64 33 72 39" fill="none" stroke="#0C0A09" stroke-width="2.8" stroke-linecap="round" />

  <!-- Iconic Lime Green Round Glasses -->
  <!-- Left Rim -->
  <circle cx="36" cy="50" r="11" fill="#FFFFFF" stroke="#65A30D" stroke-width="3" />
  <!-- Right Rim -->
  <circle cx="64" cy="50" r="11" fill="#FFFFFF" stroke="#65A30D" stroke-width="3" />
  <!-- Glasses Bridge -->
  <path d="M 47 49 Q 50 46 53 49" fill="none" stroke="#65A30D" stroke-width="3" stroke-linecap="round" />

  <!-- Warm Honey-Amber Eyes Behind Glasses -->
  <!-- Left Eye -->
  <circle cx="37" cy="50" r="4.2" fill="#78350F" />
  <circle cx="37.5" cy="50" r="2.1" fill="#0F172A" />
  <circle cx="35.8" cy="48" r="1.1" fill="#FFFFFF" />

  <!-- Right Eye -->
  <circle cx="63" cy="50" r="4.2" fill="#78350F" />
  <circle cx="62.5" cy="50" r="2.1" fill="#0F172A" />
  <circle cx="60.8" cy="48" r="1.1" fill="#FFFFFF" />

  <!-- Rounded Friendly Nose -->
  <path d="M 48 57 Q 50 61 53 58" fill="none" stroke="#92400E" stroke-width="2.2" stroke-linecap="round" />

  <!-- Subtle Freckles Across Cheeks -->
  <circle cx="31" cy="59" r="0.8" fill="#92400E" />
  <circle cx="34" cy="62" r="0.8" fill="#92400E" />
  <circle cx="66" cy="59" r="0.8" fill="#92400E" />
  <circle cx="69" cy="62" r="0.8" fill="#92400E" />

  <!-- Rosy Cheerful Blush -->
  <circle cx="28" cy="59" r="4.5" fill="#B45309" opacity="0.35" />
  <circle cx="72" cy="59" r="4.5" fill="#B45309" opacity="0.35" />

  <!-- Optimistic Warm Asymmetrical Smile -->
  <path d="M 40 68 Q 50 75 61 68" fill="none" stroke="#991B1B" stroke-width="2.6" stroke-linecap="round" />

  <!-- White Embroidered Blouse Collar & Butterfly Accent -->
  <g>
    <!-- Scalloped White Collar Base -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#F8FAFC" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Black Embroidered Floral Stitching Line -->
    <path d="M 30 84 Q 50 89 70 84" fill="none" stroke="#0F172A" stroke-width="1.2" stroke-dasharray="2,2" />
    <!-- Yellow Embroidered Miracle Butterfly Motif -->
    <polygon points="50,83 47,80 50,85 53,80" fill="#FACC15" stroke="#CA8A04" stroke-width="0.8" />
  </g>
</svg>
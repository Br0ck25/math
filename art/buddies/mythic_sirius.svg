<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />

  <!-- Wild, Wavy Shoulder-Length Dark Hair (Back/Silhouette) -->
  <path d="
    M 20 44 
    C 10 32 18 12 36 10 
    C 44 8 56 8 64 10 
    C 82 12 90 32 80 44 
    C 88 56 86 74 80 84 
    L 20 84 
    C 14 74 12 56 20 44 
    Z" fill="#1E293B" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Disheveled Curtain Bangs / Strands -->
  <path d="
    M 21 34 
    Q 32 38 38 28 
    Q 44 44 50 30 
    Q 56 44 62 28 
    Q 68 38 79 34 
    L 79 24 
    Q 50 14 21 24 
    Z" fill="#1E293B" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Intense / Rebellious Eyebrows -->
  <path d="M 28 40 Q 36 34 44 39" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 56 39 Q 64 34 72 40" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" />

  <!-- Sharp, Piercing Slate-Gray Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="3.8" fill="#64748B" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="36.8" cy="46" r="1" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="48" rx="8" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="48" r="3.8" fill="#64748B" />
  <circle cx="61.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="59.8" cy="46" r="1" fill="#FFFFFF" />

  <!-- Aristocratic / Aquiline Nose -->
  <path d="M 48 54 L 51 59 L 47 60" fill="none" stroke="#B45309" stroke-width="2.2" stroke-linecap="round" />

  <!-- Azkaban Runic Tattoo Accent on Neck/Jaw -->
  <path d="M 27 68 L 27 74 M 25 71 L 29 71" stroke="#475569" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 73 68 L 73 74 M 71 71 L 75 71" stroke="#475569" stroke-width="1.4" stroke-linecap="round" />

  <!-- Stubble / Scruff Shading Along Jawline -->
  <circle cx="34" cy="72" r="0.8" fill="#475569" />
  <circle cx="38" cy="75" r="0.8" fill="#475569" />
  <circle cx="43" cy="77" r="0.8" fill="#475569" />
  <circle cx="50" cy="78" r="0.8" fill="#475569" />
  <circle cx="57" cy="77" r="0.8" fill="#475569" />
  <circle cx="62" cy="75" r="0.8" fill="#475569" />
  <circle cx="66" cy="72" r="0.8" fill="#475569" />

  <!-- Charming / Reckless Smirk -->
  <path d="M 40 68 Q 50 74 61 67" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />

  <!-- Weathered Pinstripe Prisoner / Marauder Collar Base -->
  <g>
    <!-- Collar Fold -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#334155" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Distressed White Prison Stripes -->
    <path d="M 35 82.5 L 37 83 L 37 90 L 35 89.5 Z" fill="#94A3B8" />
    <path d="M 48 83.8 L 51 83.8 L 51 91.8 L 48 91.8 Z" fill="#94A3B8" />
    <path d="M 63 83 L 65 82.5 L 65 89.5 L 63 90 Z" fill="#94A3B8" />
  </g>
</svg>
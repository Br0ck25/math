<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <!-- Siberian Husky Pointed Ears -->
  <!-- Left Ear -->
  <polygon points="28,38 14,8 38,20" fill="#99F6E4" stroke="#0F766E" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="27,33 19,16 34,23" fill="#FFFFFF"/>
  <!-- Right Ear -->
  <polygon points="72,38 86,8 62,20" fill="#99F6E4" stroke="#0F766E" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="73,33 81,16 66,23" fill="#FFFFFF"/>
  <!-- Main Husky Head Shape (Teal / Mint Husky Fur) -->
  <rect x="22" y="24" width="56" height="58" rx="18" fill="#5EEAD4" stroke="#0F766E" stroke-width="3.5"/>
  <!-- Winter Beanie Hat Dome (Teal-Turquoise) -->
  <path d="M 23 30 C 23 15 77 15 77 30 Z" fill="#0D9488" stroke="#042F2E" stroke-width="3" stroke-linejoin="round"/>
  <!-- Beanie Yellow Trim / Stripe -->
  <path d="M 23 27 Q 50 31 77 27" fill="none" stroke="#FACC15" stroke-width="2.5"/>
  <!-- Beanie Fluffy White Fur Brim -->
  <rect x="20" y="27" width="60" height="7" rx="3.5" fill="#FFFFFF" stroke="#042F2E" stroke-width="1.5"/>
  <!-- Beanie Crest Badge (Snowflake Shield) -->
  <polygon points="50,14 57,18 55,25 50,28 45,25 43,18" fill="#FFFFFF" stroke="#0D9488" stroke-width="1"/>
  <!-- Snowflake Emblem -->
  <line x1="50" y1="18" x2="50" y2="24" stroke="#0284C7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="47" y1="21" x2="53" y2="21" stroke="#0284C7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="48" y1="19" x2="52" y2="23" stroke="#0284C7" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="52" y1="19" x2="48" y2="23" stroke="#0284C7" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Husky White Face Mask Patch -->
  <path d="M 28 40 C 35 44 42 42 42 46 C 42 49 32 50 30 54 L 70 54 C 68 50 58 49 58 46 C 58 42 65 44 72 40 C 74 46 76 52 76 58 C 76 74 65 80 50 80 C 35 80 24 74 24 58 C 24 52 26 46 28 40 Z" fill="#FFFFFF"/>
  <!-- Eyelashes -->
  <line x1="30" y1="41" x2="26" y2="38" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="29" y2="34" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="70" y1="41" x2="74" y2="38" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="68" y1="38" x2="71" y2="34" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Big Pup Eyes (Everest's Bright Sky Blue / Cyan Eyes) -->
  <ellipse cx="36" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <circle cx="37" cy="46" r="3.8" fill="#0284C7"/>
  <circle cx="37" cy="46" r="2.2" fill="#0F172A"/>
  <circle cx="35" cy="43.5" r="1.3" fill="#FFFFFF"/>
  <ellipse cx="64" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <circle cx="63" cy="46" r="3.8" fill="#0284C7"/>
  <circle cx="63" cy="46" r="2.2" fill="#0F172A"/>
  <circle cx="61" cy="43.5" r="1.3" fill="#FFFFFF"/>
  <!-- Rosy Cheeks -->
  <circle cx="28" cy="56" r="3.5" fill="#F472B6" opacity="0.45"/>
  <circle cx="72" cy="56" r="3.5" fill="#F472B6" opacity="0.45"/>
  <!-- White Snout / Muzzle Area -->
  <rect x="30" y="52" width="40" height="26" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5"/>
  <!-- Dark Slate/Blue Dog Nose -->
  <ellipse cx="50" cy="58" rx="6.5" ry="4.5" fill="#0F172A"/>
  <ellipse cx="48.5" cy="56.8" rx="1.8" ry="1.1" fill="#94A3B8"/>
  <!-- Happy Open Smile with Pink Tongue -->
  <path d="M 43 67 Q 50 74 57 67" fill="#881337" stroke="#0F766E" stroke-width="2"/>
  <path d="M 46 70 Q 50 67 54 70" fill="#FB7185"/>
</svg>
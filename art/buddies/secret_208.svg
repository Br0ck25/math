<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Long Pointed Scruffy Coyote Ears -->
  <!-- Left Ear -->
  <path d="M 28 36 C 22 10 32 4 42 18 L 38 34 Z" fill="#92400E" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
  <path d="M 30 30 C 27 15 34 10 38 18" fill="#FDE68A" />

  <!-- Right Ear -->
  <path d="M 72 36 C 78 10 68 4 58 18 L 62 34 Z" fill="#92400E" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
  <path d="M 70 30 C 73 15 66 10 62 18" fill="#FDE68A" />

  <!-- Scruffy Cheek Fur Tufts (Classic Wile E. spike cheeks) -->
  <polygon points="22,46 12,52 20,58 10,64 22,68" fill="#92400E" stroke="#451A03" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="78,46 88,52 80,58 90,64 78,68" fill="#92400E" stroke="#451A03" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Main Head Shape (Coyote Brown) -->
  <rect x="22" y="24" width="56" height="58" rx="18" fill="#92400E" stroke="#451A03" stroke-width="3.5" />

  <!-- Conniving / Plotting Angled Eyebrows -->
  <path d="M 30 32 L 44 38" fill="none" stroke="#451A03" stroke-width="3" stroke-linecap="round" />
  <path d="M 70 32 L 56 38" fill="none" stroke="#451A03" stroke-width="3" stroke-linecap="round" />

  <!-- Intense Yellow / Cartoony Eyes -->
  <ellipse cx="38" cy="44" rx="6.5" ry="8.5" fill="#FEF08A" stroke="#451A03" stroke-width="2" />
  <circle cx="40" cy="44" r="3.2" fill="#0F172A" />
  <circle cx="38.5" cy="42" r="1.1" fill="#FFFFFF" />

  <ellipse cx="62" cy="44" rx="6.5" ry="8.5" fill="#FEF08A" stroke="#451A03" stroke-width="2" />
  <circle cx="60" cy="44" r="3.2" fill="#0F172A" />
  <circle cx="58.5" cy="42" r="1.1" fill="#FFFFFF" />

  <!-- Lower Face / Tan Muzzle Area -->
  <path d="M 28 54 C 28 48 38 48 50 48 C 62 48 72 48 72 54 C 72 74 64 80 50 80 C 36 80 28 74 28 54 Z" fill="#FDE68A" stroke="#451A03" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Long Sharp Coyote Nose -->
  <ellipse cx="50" cy="54" rx="8" ry="5.5" fill="#0F172A" />
  <ellipse cx="48.5" cy="52.5" rx="2" ry="1.2" fill="#64748B" />

  <!-- Whisker Freckles -->
  <circle cx="36" cy="62" r="1.2" fill="#78350F" />
  <circle cx="34" cy="67" r="1.2" fill="#78350F" />
  <circle cx="64" cy="62" r="1.2" fill="#78350F" />
  <circle cx="66" cy="67" r="1.2" fill="#78350F" />

  <!-- Scheming Grin with Gritted Teeth (Classic ACME plotting look) -->
  <path d="M 37 66 Q 50 74 63 66" fill="#881337" stroke="#451A03" stroke-width="2" />
  <path d="M 40 68 Q 50 72 60 68" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <!-- Teeth separator lines -->
  <line x1="46" y1="67" x2="46" y2="71" stroke="#451A03" stroke-width="1.2" />
  <line x1="50" y1="67.5" x2="50" y2="72" stroke="#451A03" stroke-width="1.2" />
  <line x1="54" y1="67" x2="54" y2="71" stroke="#451A03" stroke-width="1.2" />
</svg>
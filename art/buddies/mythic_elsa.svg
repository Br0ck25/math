    <!-- Snowflake / Ice Shard Facets -->
    <polygon points="40,84 43,81 46,84 43,87" fill="#E0F2FE" />
    <polygon points="50,84 53,81 56,84 53,87" fill="#FFFFFF" />
    <polygon points="60,84 63,81 66,84 63,87" fill="#E0F2FE" />

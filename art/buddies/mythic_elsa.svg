  <path d="M 36 12 Q 40 22 36 28" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
  <path d="M 50 10 Q 52 20 50 26" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
  <path d="M 64 12 Q 60 22 64 28" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />


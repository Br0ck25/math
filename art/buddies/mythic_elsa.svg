  <!-- Left Eye Lashes -->
  <path d="M 28 44 Q 37 40 45 44" fill="none" stroke="#1E293B" stroke-width="2.8" stroke-linecap="round" />
  <line x1="28" y1="44" x2="25" y2="40" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="42" x2="30" y2="38" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />

  <!-- Right Eye Lashes -->

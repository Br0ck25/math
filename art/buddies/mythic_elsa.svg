  <line x1="72" y1="44" x2="75" y2="40" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
  <line x1="68" y1="42" x2="70" y2="38" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />

  <!-- Large Ice Blue Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="4.2" fill="#38BDF8" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="36.8" cy="46" r="1.1" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="48" rx="8" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="48" r="4.2" fill="#38BDF8" />
  <circle cx="61.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="59.8" cy="46" r="1.1" fill="#FFFFFF" />

  <!-- Dainty Ski-Jump Nose -->
  <path d="M 49 55 Q 50 59 53 58" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

  <!-- Rosy Pink Cheeks -->
  <circle cx="27" cy="58" r="4.5" fill="#FB7185" opacity="0.4" />
  <circle cx="73" cy="58" r="4.5" fill="#FB7185" opacity="0.4" />


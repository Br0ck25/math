<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Tall Gray Rabbit Ears with Pink Insides -->
  <!-- Left Ear -->
  <path d="M 37 32 C 30 6 42 2 47 18 L 45 32 Z" fill="#94A3B8" stroke="#1E293B" stroke-width="3" stroke-linejoin="round" />
  <path d="M 39 26 C 35 10 42 7 45 18" fill="#F472B6" />

  <!-- Right Ear (Tipped slightly) -->
  <path d="M 55 32 C 55 4 72 2 68 20 L 62 32 Z" fill="#94A3B8" stroke="#1E293B" stroke-width="3" stroke-linejoin="round" />
  <path d="M 58 26 C 59 10 68 8 65 20" fill="#F472B6" />

  <!-- Main Head Shape (Classic Gray) -->
  <rect x="24" y="28" width="52" height="54" rx="18" fill="#94A3B8" stroke="#1E293B" stroke-width="3.5" />

  <!-- White Lower Cheeks / Fluffs -->
  <path d="M 24 54 C 24 74 38 80 50 80 C 62 80 76 74 76 54 C 76 46 68 46 50 48 C 32 46 24 46 24 54 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Expressive Eyebrows -->
  <path d="M 32 35 Q 38 31 43 35" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 57 35 Q 62 31 68 35" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />

  <!-- Large Oval Eyes -->
  <ellipse cx="38" cy="45" rx="6.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
  <circle cx="39" cy="45" r="3.2" fill="#1E293B" />
  <circle cx="37.5" cy="43" r="1.1" fill="#FFFFFF" />

  <ellipse cx="62" cy="45" rx="6.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
  <circle cx="61" cy="45" r="3.2" fill="#1E293B" />
  <circle cx="59.5" cy="43" r="1.1" fill="#FFFFFF" />

  <!-- Tiny Pink Rabbit Nose -->
  <polygon points="50,56 46,52 54,52" fill="#F472B6" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Whiskers -->
  <line x1="22" y1="58" x2="14" y2="56" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="22" y1="62" x2="15" y2="64" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="78" y1="58" x2="86" y2="56" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="78" y1="62" x2="85" y2="64" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />

  <!-- Sassy Smirk & Iconic Buck Teeth -->
  <path d="M 42 61 Q 50 67 58 61" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <rect x="46" y="62.5" width="3.8" height="6.5" rx="1" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2" />
  <rect x="50.2" y="62.5" width="3.8" height="6.5" rx="1" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2" />
</svg>
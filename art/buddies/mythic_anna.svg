  <line x1="67" y1="42" x2="69" y2="39" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Large Sparkling Turquoise / Sea-Green Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="4.2" fill="#0EA5E9" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />

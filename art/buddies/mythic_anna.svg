  <circle cx="32" cy="56" r="1" fill="#C2410C" />
  <circle cx="35" cy="58" r="1" fill="#C2410C" />
  <circle cx="33" cy="61" r="1" fill="#C2410C" />
  <circle cx="45" cy="59" r="1" fill="#C2410C" />
  <circle cx="55" cy="59" r="1" fill="#C2410C" />
  <circle cx="65" cy="58" r="1" fill="#C2410C" />
  <circle cx="68" cy="56" r="1" fill="#C2410C" />
  <circle cx="67" cy="61" r="1" fill="#C2410C" />


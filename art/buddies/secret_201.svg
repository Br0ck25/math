<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pointed Triangular Dog Ears -->
  <polygon points="50,26 44,12 56,18" fill="#78350F" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
  <polygon points="63,28 61,14 73,20" fill="#78350F" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />

  <!-- Danny's Purple Shirt (Bottom Base) -->
  <path d="M 28 88 L 36 68 Q 50 64 64 68 L 72 88 Z" fill="#9333EA" stroke="#6B21A8" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Warm Brown Dog Head & Snout Silhouette -->
  <path d="M 22 36 C 22 30 27 28 32 30 L 52 38 C 68 28 84 38 84 54 C 84 72 64 78 46 72 C 34 68 28 56 34 46 L 24 44 C 22 43 22 39 22 36 Z" fill="#92400E" stroke="#451A03" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Snout Tip Oval Disc -->
  <ellipse cx="23" cy="38" rx="4.5" ry="7.5" fill="#451A03" stroke="#451A03" stroke-width="2" />

  <!-- Nostril Highlights -->
  <circle cx="23" cy="35" r="1.1" fill="#78350F" />
  <circle cx="23" cy="41" r="1.1" fill="#78350F" />

  <!-- Stylized Eyes (Both on top profile) -->
  <!-- Left Eye -->
  <circle cx="48" cy="33" r="6.5" fill="#FFFFFF" stroke="#451A03" stroke-width="2.5" />
  <circle cx="48" cy="33" r="2.3" fill="#0F172A" />
  <circle cx="47" cy="31.8" r="0.8" fill="#FFFFFF" />

  <!-- Right Eye -->
  <circle cx="61" cy="36" r="6.5" fill="#FFFFFF" stroke="#451A03" stroke-width="2.5" />
  <circle cx="61" cy="36" r="2.3" fill="#0F172A" />
  <circle cx="60" cy="34.8" r="0.8" fill="#FFFFFF" />

  <!-- Warm Rosy Cheek Circle -->
  <circle cx="64" cy="56" r="8" fill="#DC2626" opacity="0.45" />

  <!-- Whisker Spots on Cheek -->
  <circle cx="34" cy="46" r="1" fill="#451A03" />
  <circle cx="37" cy="49" r="1" fill="#451A03" />
  <circle cx="33" cy="51" r="1" fill="#451A03" />

  <!-- Big Enthusiastic Pup Smile -->
  <path d="M 38 54 Q 46 65 55 56" fill="none" stroke="#451A03" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 44 60 Q 48 66 52 60" fill="#FB7185" stroke="#451A03" stroke-width="1.5" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <rect width="100" height="100" rx="24" fill="#E0F2FE" />

  <!-- Left Ear (Dark Slate Blue with Light Blue Inner Ear) -->
  <polygon points="27,42 16,16 38,25" fill="#1E3A8A" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
  <polygon points="26,36 21,22 34,27" fill="#BAE6FD" />

  <!-- Right Ear -->
  <polygon points="73,42 84,16 62,25" fill="#1E3A8A" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
  <polygon points="74,36 79,22 66,27" fill="#BAE6FD" />

  <!-- Main Body / Head Block (Blue Heeler Pup Medium Blue) -->
  <rect x="22" y="24" width="56" height="58" rx="18" fill="#38BDF8" stroke="#0F172A" stroke-width="3.5" />

  <!-- Left Eye Patch (Dark Blue, Socks Marking) -->
  <rect x="24" y="32" width="24" height="28" rx="10" fill="#1E3A8A" />

  <!-- Light Baby Blue Eyebrows -->
  <rect x="29" y="30" width="12" height="4" rx="2" fill="#E0F2FE" />
  <rect x="59" y="30" width="12" height="4" rx="2" fill="#E0F2FE" />

  <!-- Extra Wide Curious Baby Eyes -->
  <ellipse cx="36" cy="46" rx="7" ry="9" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
  <circle cx="36" cy="46" r="3.8" fill="#0F172A" />
  <circle cx="34" cy="43.5" r="1.4" fill="#FFFFFF" />

  <ellipse cx="64" cy="46" rx="7" ry="9" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
  <circle cx="64" cy="46" r="3.8" fill="#0F172A" />
  <circle cx="62" cy="43.5" r="1.4" fill="#FFFFFF" />

  <!-- Rosy Pup Cheeks -->
  <circle cx="27" cy="54" r="3.5" fill="#F472B6" opacity="0.45" />
  <circle cx="73" cy="54" r="3.5" fill="#F472B6" opacity="0.45" />

  <!-- Light Blue Snout / Muzzle Area -->
  <rect x="30" y="52" width="40" height="26" rx="12" fill="#BAE6FD" stroke="#0F172A" stroke-width="2.5" />

  <!-- Small Pup Nose -->
  <ellipse cx="50" cy="58" rx="6.5" ry="4.5" fill="#0F172A" />
  <ellipse cx="48.5" cy="56.8" rx="1.8" ry="1.1" fill="#94A3B8" />

  <!-- Cute Open Puppy Smile showing single baby tooth -->
  <path d="M 43 66 Q 50 74 57 66" fill="#881337" stroke="#0F172A" stroke-width="2" />
  <path d="M 46 69 Q 50 66 54 69" fill="#FB7185" />
  <rect x="48" y="66" width="3.5" height="3" rx="0.8" fill="#FFFFFF" />
</svg>
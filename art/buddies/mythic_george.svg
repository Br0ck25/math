<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pig Ears (Top of Head, slightly smaller than Peppa's) -->
  <path d="M 52 26 C 50 17 57 15 59 24 Z" fill="#FCA5A5" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" />
  <path d="M 63 28 C 62 19 69 17 71 26 Z" fill="#FCA5A5" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" />

  <!-- George's Signature Blue Shirt (Bottom Base) -->
  <path d="M 30 88 L 37 70 Q 50 66 63 70 L 70 88 Z" fill="#0284C7" stroke="#0369A1" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Iconic Hairdryer Head & Snout Silhouette (Little Brother proportions) -->
  <path d="M 24 38 C 24 33 28 31 33 33 L 50 40 C 65 31 80 40 80 55 C 80 71 62 76 46 71 C 35 67 30 56 35 47 L 26 45 C 24 44 24 41 24 38 Z" fill="#FCA5A5" stroke="#E11D48" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Snout Tip Oval Disc -->
  <ellipse cx="25" cy="40" rx="4.2" ry="7" fill="#FCA5A5" stroke="#E11D48" stroke-width="3" />

  <!-- Snout Nostrils -->
  <circle cx="24" cy="37.5" r="1.2" fill="#E11D48" />
  <circle cx="24" cy="42.5" r="1.2" fill="#E11D48" />

  <!-- Large Stylized Eyes (Both on top profile) -->
  <!-- Left Eye -->
  <circle cx="47" cy="35" r="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2.5" />
  <circle cx="47" cy="35" r="2.2" fill="#0F172A" />
  <circle cx="46" cy="34" r="0.8" fill="#FFFFFF" />

  <!-- Right Eye -->
  <circle cx="59" cy="38" r="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2.5" />
  <circle cx="59" cy="38" r="2.2" fill="#0F172A" />
  <circle cx="58" cy="37" r="0.8" fill="#FFFFFF" />

  <!-- Rosy Pink Cheek Circle -->
  <circle cx="61" cy="56" r="7.5" fill="#F43F5E" opacity="0.6" />

  <!-- Wide Happy Little Brother Smile -->
  <path d="M 39 55 Q 46 64 53 56" fill="none" stroke="#E11D48" stroke-width="2.8" stroke-linecap="round" />

  <!-- Dinosaur Accent Badge (Mr. Dinosaur silhouette on his shirt) -->
  <g transform="translate(43, 72) scale(0.65)">
    <path d="M 8 20 C 6 16 10 12 14 10 C 18 8 22 10 22 13 C 22 15 20 16 18 16 C 18 18 20 20 20 22 C 20 23 18 24 16 24 C 15 26 13 26 12 24 C 10 24 9 22 8 20 Z" fill="#22C55E" stroke="#15803D" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="16" cy="12" r="1" fill="#0F172A" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <!-- Mixed Breed Floppy / Scruffy Ears (Behind head) -->
  <!-- Left Ear -->
  <path d="M 27 38 C 14 44 13 65 19 75 C 23 80 30 79 33 72 C 35 66 33 50 31 40 Z" fill="#64748B" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>

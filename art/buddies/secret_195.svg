  <!-- Scruffy Eyebrows -->
  <rect x="28" y="34" width="13" height="4" rx="2" fill="#1E293B"/>
  <rect x="59" y="34" width="13" height="4" rx="2" fill="#1E293B"/>
  <!-- Bright Orange / Hazel Pup Eyes -->
  <ellipse cx="36" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <circle cx="37" cy="46" r="3.8" fill="#EA580C"/>
  <circle cx="37" cy="46" r="2.2" fill="#0F172A"/>
  <circle cx="35" cy="43.5" r="1.3" fill="#FFFFFF"/>
  <ellipse cx="64" cy="46" rx="6.5" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <circle cx="63" cy="46" r="3.8" fill="#EA580C"/>
  <circle cx="63" cy="46" r="2.2" fill="#0F172A"/>
  <circle cx="61" cy="43.5" r="1.3" fill="#FFFFFF"/>

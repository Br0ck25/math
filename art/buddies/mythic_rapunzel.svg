  <!-- Soft Golden Hair Highlights -->
  <path d="M 32 14 Q 38 24 34 30" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />
  <path d="M 48 10 Q 52 20 48 28" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />
  <path d="M 64 14 Q 60 22 66 28" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />

  <!-- Warm Light-Brown Expressive Eyebrows -->
  <path d="M 28 38 Q 36 32 44 37" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 56 37 Q 64 32 72 38" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" />

  <!-- Eyelashes -->
  <!-- Left Eye Lashes -->
  <path d="M 28 43 Q 37 39 45 43" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="28" y1="43" x2="25" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="33" y1="41" x2="31" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Right Eye Lashes -->
  <path d="M 55 43 Q 63 39 72 43" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="72" y1="43" x2="75" y2="40" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="67" y1="41" x2="69" y2="38" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Large Sparkling Bright Green Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="4.4" fill="#22C55E" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="36.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="39.8" cy="49.5" r="0.7" fill="#86EFAC" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="48" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="48" r="4.4" fill="#22C55E" />
  <circle cx="61.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="59.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="62.8" cy="49.5" r="0.7" fill="#86EFAC" />

  <!-- Petite Upturned Nose -->
  <path d="M 48 56 Q 50 59 53 57" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

  <!-- Delicate Freckles Across Cheeks and Nose -->
  <circle cx="33" cy="57" r="0.9" fill="#D97706" />
  <circle cx="36" cy="59" r="0.9" fill="#D97706" />
  <circle cx="34" cy="62" r="0.9" fill="#D97706" />
  <circle cx="45" cy="60" r="0.9" fill="#D97706" />
  <circle cx="55" cy="60" r="0.9" fill="#D97706" />
  <circle cx="64" cy="59" r="0.9" fill="#D97706" />
  <circle cx="67" cy="57" r="0.9" fill="#D97706" />
  <circle cx="66" cy="62" r="0.9" fill="#D97706" />

  <!-- Rosy Cheeks -->
  <circle cx="28" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />
  <circle cx="72" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />

  <!-- Playful Open-Hearted Grin -->
  <path d="M 39 67 Q 50 75 61 67" fill="none" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" />

  <!-- Lavender Corset Dress Collar Base with Pink Lacing -->
  <g>
    <!-- Bodice Fold -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#C084FC" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Lace Accent Trim -->
    <path d="M 40 82 Q 50 85 60 82" fill="none" stroke="#F472B6" stroke-width="1.8" stroke-linecap="round" />
    <!-- Center Criss-Cross Lacing -->
    <line x1="48" y1="83" x2="52" y2="87" stroke="#F43F5E" stroke-width="1.4" stroke-linecap="round" />
    <line x1="52" y1="83" x2="48" y2="87" stroke="#F43F5E" stroke-width="1.4" stroke-linecap="round" />
  </g>
</svg>
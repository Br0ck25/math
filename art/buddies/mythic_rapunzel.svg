  <circle cx="82" cy="60" r="3" fill="#38BDF8" stroke="#0369A1" stroke-width="1.2" />
  <circle cx="82" cy="60" r="1.1" fill="#FEF08A" />

  <!-- Main Head Squircle Base (Fair Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Golden Flowing Swept Bangs -->

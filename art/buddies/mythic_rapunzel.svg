<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />

  <!-- Golden Blonde Hair Volume (Back Silhouette) -->
  <path d="
    M 20 46 
    C 10 26 18 10 36 6 
    C 44 4 56 4 64 6 
    C 82 10 90 26 80 46 
    C 88 60 86 78 82 86 
    L 18 86 
    C 14 78 12 60 20 46 
    Z" fill="#FACC15" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Floral Hair Flowers Woven into Hair -->
  <!-- Left Magenta Flower -->
  <circle cx="16" cy="40" r="3.2" fill="#EC4899" stroke="#9D174D" stroke-width="1.2" />
  <circle cx="16" cy="40" r="1.2" fill="#FEF08A" />

  <!-- Left Purple Flower -->
  <circle cx="18" cy="62" r="3" fill="#A855F7" stroke="#6B21A8" stroke-width="1.2" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pig Ears (Top of Head) -->
  <path d="M 52 24 C 50 14 58 12 60 22 Z" fill="#FCA5A5" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" />
  <path d="M 64 26 C 63 16 71 14 73 24 Z" fill="#FCA5A5" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" />

  <!-- Red Dress (Bottom Base) -->
  <path d="M 28 88 L 36 68 Q 50 64 64 68 L 72 88 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Iconic Hairdryer Head & Snout Silhouette -->
  <!-- Snout snout tip + bridge + cheek curve -->
  <path d="M 22 36 C 22 30 27 28 32 30 L 52 38 C 68 28 84 38 84 54 C 84 72 64 78 46 72 C 34 68 28 56 34 46 L 24 44 C 22 43 22 39 22 36 Z" fill="#FCA5A5" stroke="#E11D48" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Snout Tip Oval Disc -->
  <ellipse cx="23" cy="38" rx="4.5" ry="7.5" fill="#FCA5A5" stroke="#E11D48" stroke-width="3" />

  <!-- Snout Nostrils -->
  <circle cx="22" cy="35" r="1.3" fill="#E11D48" />
  <circle cx="22" cy="41" r="1.3" fill="#E11D48" />

  <!-- Large Stylized Eyes (Both on top profile) -->
  <!-- Left Eye -->
  <circle cx="48" cy="33" r="6.5" fill="#FFFFFF" stroke="#E11D48" stroke-width="2.5" />
  <circle cx="48" cy="33" r="2.3" fill="#0F172A" />
  <circle cx="47" cy="31.8" r="0.8" fill="#FFFFFF" />

  <!-- Right Eye -->
  <circle cx="61" cy="36" r="6.5" fill="#FFFFFF" stroke="#E11D48" stroke-width="2.5" />
  <circle cx="61" cy="36" r="2.3" fill="#0F172A" />
  <circle cx="60" cy="34.8" r="0.8" fill="#FFFFFF" />

  <!-- Rosy Pink Cheek Circle -->
  <circle cx="64" cy="56" r="8" fill="#F43F5E" opacity="0.6" />

  <!-- Curved Grin / Smile -->
  <path d="M 38 54 Q 46 64 54 55" fill="none" stroke="#E11D48" stroke-width="2.8" stroke-linecap="round" />
</svg>
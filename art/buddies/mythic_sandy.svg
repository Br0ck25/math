<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <rect width="100" height="100" rx="24" fill="#CFFAFE" />

  <!-- Helmet Back Rim / Collar -->
  <ellipse cx="50" cy="80" rx="28" ry="8" fill="#94A3B8" stroke="#334155" stroke-width="2.5" />

  <!-- Glass Helmet Dome Base -->
  <circle cx="50" cy="48" r="38" fill="#F0FDFA" fill-opacity="0.5" stroke="#0284C7" stroke-width="3" />

  <!-- Squirrel Ears (inside helmet dome) -->
  <circle cx="28" cy="27" r="7.5" fill="#B45309" stroke="#78350F" stroke-width="2" />
  <circle cx="28" cy="27" r="4" fill="#FDE68A" />

  <circle cx="72" cy="27" r="7.5" fill="#B45309" stroke="#78350F" stroke-width="2" />
  <circle cx="72" cy="27" r="4" fill="#FDE68A" />

  <!-- Squirrel Head Shape -->
  <ellipse cx="50" cy="48" rx="24" ry="22" fill="#D97706" stroke="#78350F" stroke-width="2.5" />

  <!-- Lower Muzzle / Cheeks (Tan/Cream) -->
  <ellipse cx="50" cy="54" rx="19" ry="14" fill="#FDE68A" />

  <!-- Big Squirrel Eyes -->
  <ellipse cx="40" cy="42" rx="6.5" ry="8" fill="#FFFFFF" stroke="#78350F" stroke-width="2" />
  <circle cx="41" cy="42" r="3.2" fill="#0F172A" />
  <circle cx="39.5" cy="40.2" r="1.1" fill="#FFFFFF" />

  <ellipse cx="60" cy="42" rx="6.5" ry="8" fill="#FFFFFF" stroke="#78350F" stroke-width="2" />
  <circle cx="59" cy="42" r="3.2" fill="#0F172A" />
  <circle cx="57.5" cy="40.2" r="1.1" fill="#FFFFFF" />

  <!-- Eyelashes -->
  <line x1="36" y1="34" x2="33" y2="30" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" />
  <line x1="41" y1="33" x2="41" y2="28" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" />
  <line x1="59" y1="33" x2="59" y2="28" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" />
  <line x1="64" y1="34" x2="67" y2="30" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" />

  <!-- Small Black Nose -->
  <ellipse cx="50" cy="49" rx="3.2" ry="2.2" fill="#1E293B" />

  <!-- Cheerful Grin & Buck Teeth -->
  <path d="M 39 55 Q 50 64 61 55" fill="none" stroke="#78350F" stroke-width="2" stroke-linecap="round" />
  <rect x="46" y="56" width="3.5" height="5" rx="0.8" fill="#FFFFFF" stroke="#78350F" stroke-width="1" />
  <rect x="50.5" y="56" width="3.5" height="5" rx="0.8" fill="#FFFFFF" stroke="#78350F" stroke-width="1" />

  <!-- Helmet Glass Glare Highlight -->
  <path d="M 22 36 A 34 34 0 0 1 45 16" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Helmet Flower (Exterior Accent) -->
  <g transform="translate(68, 16)">
    <!-- Petals -->
    <circle cx="0" cy="-6" r="4.5" fill="#EC4899" />
    <circle cx="6" cy="-2" r="4.5" fill="#EC4899" />
    <circle cx="4" cy="5" r="4.5" fill="#EC4899" />
    <circle cx="-4" cy="5" r="4.5" fill="#EC4899" />
    <circle cx="-6" cy="-2" r="4.5" fill="#EC4899" />
    <!-- Flower Center -->
    <circle cx="0" cy="0" r="3.8" fill="#FACC15" stroke="#78350F" stroke-width="1.2" />
  </g>
</svg>
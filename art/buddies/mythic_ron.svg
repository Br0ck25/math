<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears -->
  <!-- Left Ear -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <path d="M 18 53 Q 21 54 20 57" fill="none" stroke="#EA580C" stroke-width="1.6" stroke-linecap="round" />

  <!-- Right Ear -->
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <path d="M 82 53 Q 79 54 80 57" fill="none" stroke="#EA580C" stroke-width="1.6" stroke-linecap="round" />

  <!-- Shaggy Vivid Ginger/Orange Hair (Behind Head Silhouette) -->
  <path d="
    M 20 52 
    C 14 34 22 16 38 12 
    C 44 8 56 8 62 12 
    C 78 16 86 34 80 52 
    Z" fill="#EA580C" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Messy Choppy Front Bangs / Fringe -->
  <path d="
    M 22 34 
    Q 28 38 34 32 
    Q 42 43 50 34 
    Q 58 43 66 32 
    Q 72 38 78 33 
    L 78 24 
    Q 50 15 22 24 
    Z" fill="#EA580C" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Expressive / Slightly Worried Orange Eyebrows -->
  <path d="M 28 41 Q 35 36 43 41" fill="none" stroke="#C2410C" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 57 41 Q 65 36 72 41" fill="none" stroke="#C2410C" stroke-width="2.6" stroke-linecap="round" />

  <!-- Wide Cartoon Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="50" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="50" r="3.6" fill="#38BDF8" />
  <circle cx="38.5" cy="50" r="2.1" fill="#0F172A" />
  <circle cx="36.8" cy="48" r="1" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="50" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="50" r="3.6" fill="#38BDF8" />
  <circle cx="61.5" cy="50" r="2.1" fill="#0F172A" />
  <circle cx="59.8" cy="48" r="1" fill="#FFFFFF" />

  <!-- Button Nose -->
  <path d="M 47 57 Q 50 61 53 58" fill="none" stroke="#C2410C" stroke-width="2.2" stroke-linecap="round" />

  <!-- Signature Weasley Freckles Across Cheeks and Nose -->
  <circle cx="31" cy="57" r="1.1" fill="#C2410C" />
  <circle cx="35" cy="59" r="1.1" fill="#C2410C" />
  <circle cx="33" cy="62" r="1.1" fill="#C2410C" />
  <circle cx="45" cy="60" r="1.1" fill="#C2410C" />
  <circle cx="55" cy="60" r="1.1" fill="#C2410C" />
  <circle cx="67" cy="57" r="1.1" fill="#C2410C" />
  <circle cx="65" cy="59" r="1.1" fill="#C2410C" />
  <circle cx="67" cy="62" r="1.1" fill="#C2410C" />

  <!-- Charming Crooked / Half-Grin Smile -->
  <path d="M 41 68 Q 50 74 60 67" fill="none" stroke="#1E293B" stroke-width="2.4" stroke-linecap="round" />

  <!-- Gryffindor Striped Scarf Base -->
  <g>
    <!-- Scarf Base Fold -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#991B1B" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Gold Stripes -->
    <path d="M 36 82.5 L 39 83.2 L 39 90.2 L 36 89.5 Z" fill="#FACC15" />
    <path d="M 48 83.8 L 52 83.8 L 52 91.8 L 48 91.8 Z" fill="#FACC15" />
    <path d="M 61 83.2 L 64 82.5 L 64 89.5 L 61 90.2 Z" fill="#FACC15" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background badge base -->
  <rect width="100" height="100" rx="24" fill="#E0F2FE" />

  <!-- Bulbous Squid Head -->
  <ellipse cx="50" cy="38" rx="28" ry="24" fill="#93C5FD" stroke="#1E3A8A" stroke-width="3" />

  <!-- Lower Head / Neck taper -->
  <path d="M 36 50 L 36 78 C 36 80 64 80 64 78 L 64 50 Z" fill="#93C5FD" stroke="#1E3A8A" stroke-width="3" stroke-linejoin="round" />

  <!-- Forehead Wrinkles (Classic Squidward lines) -->
  <path d="M 43 21 Q 50 19 57 21" fill="none" stroke="#1E3A8A" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 41 26 Q 50 24 59 26" fill="none" stroke="#1E3A8A" stroke-width="1.8" stroke-linecap="round" />

  <!-- Brown Polo Shirt Collar / Shoulders -->
  <path d="M 30 82 L 20 88 L 80 88 L 70 82 Z" fill="#B45309" stroke="#78350F" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="46,82 54,82 50,88" fill="#92400E" />

  <!-- Heavy / Half-Closed Eyelids (Upper) -->
  <!-- Left Eye Base -->
  <ellipse cx="38" cy="45" rx="10" ry="9" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2" />
  <!-- Right Eye Base -->
  <ellipse cx="62" cy="45" rx="10" ry="9" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2" />

  <!-- Reddish Brown / Burgundy Rectangular Pupils -->
  <rect x="36" y="44" width="4.5" height="4.5" rx="1" fill="#881337" />
  <rect x="60" y="44" width="4.5" height="4.5" rx="1" fill="#881337" />

  <!-- Half-Closed Eyelids (Slanted / Bored) -->
  <path d="M 28 44 C 28 37 48 37 48 44 Z" fill="#93C5FD" stroke="#1E3A8A" stroke-width="2" />
  <path d="M 52 44 C 52 37 72 37 72 44 Z" fill="#93C5FD" stroke="#1E3A8A" stroke-width="2" />

  <!-- Droopy Unimpressed Mouth -->
  <path d="M 37 72 Q 50 67 63 72" fill="none" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round" />
  <line x1="36" y1="71" x2="35" y2="74" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="71" x2="65" y2="74" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round" />

  <!-- Big Drooping Nose (Overlapping Eyes and Mouth) -->
  <path d="M 45 42 C 45 42 41 62 41 65 C 41 71 59 71 59 65 C 59 62 55 42 55 42 Z" fill="#93C5FD" stroke="#1E3A8A" stroke-width="2.5" stroke-linejoin="round" />
</svg>
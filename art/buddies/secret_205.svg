  <path d="M 50 16 C 50 8 51 6 52 7" fill="none" stroke="#713F12" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 54 16 C 55 10 60 8 64 9" fill="none" stroke="#713F12" stroke-width="1.8" stroke-linecap="round" />

  <!-- Tiny Canary Neck Base -->
  <path d="M 44 80 L 42 88 L 58 88 L 56 80 Z" fill="#FACC15" stroke="#713F12" stroke-width="3" stroke-linejoin="round" />


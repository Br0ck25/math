  <line x1="72" y1="36" x2="77" y2="32" stroke="#713F12" stroke-width="2" stroke-linecap="round" />
  <line x1="67" y1="33" x2="70" y2="28" stroke="#713F12" stroke-width="2" stroke-linecap="round" />

  <!-- Oversized Canary Baby Eyes -->
  <!-- Left Eye -->
  <ellipse cx="38" cy="48" rx="10" ry="14" fill="#FFFFFF" stroke="#713F12" stroke-width="2.2" />

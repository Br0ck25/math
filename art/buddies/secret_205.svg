  <!-- Right Eye -->
  <ellipse cx="62" cy="48" rx="10" ry="14" fill="#FFFFFF" stroke="#713F12" stroke-width="2.2" />
  <ellipse cx="60" cy="49" rx="6.5" ry="9" fill="#38BDF8" />
  <ellipse cx="58.5" cy="49" rx="3.5" ry="5.5" fill="#0F172A" />
  <circle cx="57" cy="45" r="1.8" fill="#FFFFFF" />

  <!-- Rosy Tinted Baby Cheeks -->
  <circle cx="26" cy="63" r="5" fill="#F472B6" opacity="0.35" />
  <circle cx="74" cy="63" r="5" fill="#F472B6" opacity="0.35" />

  <!-- Small Orange Canary Beak -->
  <!-- Upper Beak Dome -->
  <path d="M 43 62 C 43 56 57 56 57 62 C 57 66 53 69 50 69 C 47 69 43 66 43 62 Z" fill="#F97316" stroke="#C2410C" stroke-width="2.2" stroke-linejoin="round" />
  

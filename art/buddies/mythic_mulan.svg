<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears & Jade Drop Earrings -->
  <!-- Left Ear -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <circle cx="19" cy="63" r="2.4" fill="#34D399" stroke="#059669" stroke-width="1.2" />

  <!-- Right Ear -->
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <circle cx="81" cy="63" r="2.4" fill="#34D399" stroke="#059669" stroke-width="1.2" />

  <!-- Top Bun / Chignon with Lotus Flower Comb & Ribbon -->
  <ellipse cx="50" cy="11" rx="14" ry="9" fill="#18181B" stroke="#09090B" stroke-width="3" stroke-linejoin="round" />
  <ellipse cx="50" cy="11" rx="9" ry="5.5" fill="#27272A" />
  <!-- Red Ribbon Wrap -->
  <path d="M 40 18 Q 50 14 60 18 L 61 21 Q 50 17 39 21 Z" fill="#DC2626" stroke="#991B1B" stroke-width="1.2" />

  <!-- Blue Lotus Magnolia Blossom Hair Comb (Behind Right Temple) -->
  <g>
    <ellipse cx="64" cy="18" rx="2.5" ry="4.5" transform="rotate(-30 64 18)" fill="#38BDF8" stroke="#0284C7" stroke-width="1" />
    <ellipse cx="68" cy="19" rx="2.5" ry="4.5" transform="rotate(25 68 19)" fill="#7DD3FC" stroke="#0284C7" stroke-width="1" />
    <ellipse cx="65" cy="22" rx="2.5" ry="4" transform="rotate(80 65 22)" fill="#38BDF8" stroke="#0284C7" stroke-width="1" />
    <circle cx="65" cy="19" r="1.4" fill="#FDE047" />
  </g>

  <!-- Sleek Jet-Black Hair (Back Silhouette) -->
  <path d="
    M 20 44 
    C 10 26 16 12 34 8 
    C 44 6 56 6 66 8 
    C 84 12 90 26 80 44 
    C 88 58 86 76 80 84 
    L 20 84 
    C 14 76 12 58 20 44 
    Z" fill="#18181B" stroke="#09090B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Main Head Squircle Base (Fair Warm Skin Tone) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Signature Clean-Parted Bangs with Center Hanging Forehead Wisp -->
  <path d="
    M 21 34 
    Q 32 38 43 26 
    Q 48 37 50 40 
    Q 52 37 57 26 
    Q 68 38 79 34 
    L 79 24 
    Q 50 12 21 24 
    Z" fill="#18181B" stroke="#09090B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Hair Gloss Highlights -->
  <path d="M 33 13 Q 38 22 34 27" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" />
  <path d="M 63 13 Q 59 22 64 27" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" />

  <!-- Strong, Expressive Dark Eyebrows -->
  <path d="M 28 38 Q 36 32 44 37" fill="none" stroke="#09090B" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 56 37 Q 64 32 72 38" fill="none" stroke="#09090B" stroke-width="2.8" stroke-linecap="round" />

  <!-- Distinct Almond Eyeliner & Lashes -->
  <!-- Left Eye Lashes -->
  <path d="M 28 44 Q 37 39 45 44" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" />
  <line x1="28" y1="44" x2="24" y2="41" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />

  <!-- Right Eye Lashes -->
  <path d="M 55 44 Q 63 39 72 44" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" />
  <line x1="72" y1="44" x2="76" y2="41" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />

  <!-- Warm Deep Brown Almond Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="48" rx="8.5" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="48" r="4.3" fill="#3F1D0B" />
  <circle cx="38.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="36.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="39.8" cy="49.5" r="0.7" fill="#78350F" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="48" rx="8.5" ry="8.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="48" r="4.3" fill="#3F1D0B" />
  <circle cx="61.5" cy="48" r="2.2" fill="#0F172A" />
  <circle cx="59.6" cy="45.8" r="1.2" fill="#FFFFFF" />
  <circle cx="62.8" cy="49.5" r="0.7" fill="#78350F" />

  <!-- Dainty Defined Nose -->
  <path d="M 48 56 Q 50 59 53 57" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

  <!-- Soft Warm Blush -->
  <circle cx="28" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />
  <circle cx="72" cy="58" r="4.5" fill="#FB7185" opacity="0.35" />

  <!-- Confident, Warm Berry-Red Smile -->
  <path d="M 39 67 Q 50 74 61 67" fill="none" stroke="#BE123C" stroke-width="2.6" stroke-linecap="round" />

  <!-- Hanfu Cross-Collar Base (Turquoise, Red & Royal Blue) -->
  <g>
    <!-- Base Robe Silhouette -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#0284C7" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Left Inward Lapel (Red) -->
    <path d="M 26 80 L 46 88 L 38 88 L 26 83 Z" fill="#DC2626" />
    <!-- Right Overlapping Lapel (Emerald / Light Teal) -->
    <path d="M 74 80 L 44 88 L 52 88 L 74 82 Z" fill="#14B8A6" />
    <!-- Hanfu Center Cross Lines -->
    <line x1="32" y1="80" x2="48" y2="88" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />
    <line x1="68" y1="80" x2="48" y2="88" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />
  </g>
</svg>
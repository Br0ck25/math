<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Top Head Hairs (Two arched strands) -->
  <path d="M 44 14 Q 50 6 56 14" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 40 16 Q 48 8 54 17" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Side Ear (M-shaped hair loop + ear) -->
  <path d="M 22 45 Q 18 41 22 37 Q 26 33 22 29" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />
  <ellipse cx="20" cy="52" rx="4.5" ry="6" fill="#FED90F" stroke="#111827" stroke-width="2.5" />
  <path d="M 18 51 Q 21 52 20 55" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" />

  <!-- Right Side Ear -->
  <ellipse cx="80" cy="52" rx="4.5" ry="6" fill="#FED90F" stroke="#111827" stroke-width="2.5" />
  <path d="M 82 51 Q 79 52 80 55" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" />

  <!-- Main Head Shape (Squircle Style Yellow Dome) -->
  <rect x="22" y="14" width="56" height="68" rx="22" fill="#FED90F" stroke="#111827" stroke-width="3.5" />

  <!-- Side-of-Head Zig-Zag Hair ("M" Line) -->
  <path d="M 23 48 Q 28 44 24 40 Q 30 36 25 32" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round" />

  <!-- Big Round Eyes -->
  <!-- Left Eye -->
  <ellipse cx="38" cy="38" rx="10" ry="10" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" />
  <circle cx="41" cy="38" r="2.5" fill="#111827" />
  <circle cx="39.5" cy="36.5" r="0.9" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="62" cy="38" rx="10" ry="10" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" />
  <circle cx="59" cy="38" r="2.5" fill="#111827" />
  <circle cx="57.5" cy="36.5" r="0.9" fill="#FFFFFF" />

  <!-- Round Bulbous Nose (overlapping eyes) -->
  <ellipse cx="50" cy="43" rx="6.5" ry="5.5" fill="#FED90F" stroke="#111827" stroke-width="2.5" />

  <!-- Signature Homer 5 O'Clock Shadow / Muzzle -->
  <path d="M 28 54 C 28 46 38 48 50 48 C 62 48 72 46 72 54 C 74 68 68 80 50 80 C 32 80 26 68 28 54 Z" fill="#D1B071" stroke="#111827" stroke-width="2.8" stroke-linejoin="round" />

  <!-- Upper Lip Curve / Smile -->
  <path d="M 33 58 Q 50 63 67 58" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" />

  <!-- Droopy Lower Lip / Grin -->
  <path d="M 38 64 Q 50 74 62 64" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Nose to Lip Overlap Line -->
  <path d="M 44 48 Q 50 51 56 48" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />
</svg>
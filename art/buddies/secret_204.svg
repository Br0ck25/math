<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Star Hair Points (Baby Proportions) -->
  <polygon points="
    50,8 56,16 66,11 70,21 80,20 80,30 89,34 85,44 91,52 82,58 
    18,58 9,52 15,44 11,34 20,30 20,20 30,21 34,11 44,16
  " fill="#FED90F" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Left Side Ear -->
  <ellipse cx="20" cy="56" rx="4.5" ry="6" fill="#FED90F" stroke="#111827" stroke-width="2.5" />
  <path d="M 18 55 Q 21 56 20 59" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" />

  <!-- Right Side Ear -->
  <ellipse cx="80" cy="56" rx="4.5" ry="6" fill="#FED90F" stroke="#111827" stroke-width="2.5" />
  <path d="M 82 55 Q 79 56 80 59" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" />

  <!-- Main Head Squircle Base (Yellow) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED90F" stroke="#111827" stroke-width="3.5" />

  <!-- Blue Hair Bow (On Forehead) -->
  <!-- Left Ribbon Loop -->
  <polygon points="50,23 38,18 40,28" fill="#38BDF8" stroke="#111827" stroke-width="2" stroke-linejoin="round" />
  <!-- Right Ribbon Loop -->
  <polygon points="50,23 62,18 60,28" fill="#38BDF8" stroke="#111827" stroke-width="2" stroke-linejoin="round" />
  <!-- Bow Center Knot -->
  <circle cx="50" cy="23" r="3.2" fill="#0284C7" stroke="#111827" stroke-width="1.8" />

  <!-- Eyelashes -->
  <!-- Left Eye Lashes -->
  <line x1="33" y1="36" x2="30" y2="32" stroke="#111827" stroke-width="1.8" stroke-linecap="round" />
  <line x1="38" y1="34" x2="38" y2="30" stroke="#111827" stroke-width="1.8" stroke-linecap="round" />
  <line x1="43" y1="36" x2="45" y2="32" stroke="#111827" stroke-width="1.8" stroke-linecap="round" />
  <!-- Right Eye Lashes -->
  <line x1="57" y1="36" x2="55" y2="32" stroke="#111827" stroke-width="1.8" stroke-linecap="round" />
  <line x1="62" y1="34" x2="62" y2="30" stroke="#111827" stroke-width="1.8" stroke-linecap="round" />
  <line x1="67" y1="36" x2="70" y2="32" stroke="#111827" stroke-width="1.8" stroke-linecap="round" />

  <!-- Big Innocent Baby Eyes -->
  <!-- Left Eye -->
  <ellipse cx="38" cy="44" rx="9.5" ry="9.5" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" />
  <circle cx="41" cy="44" r="2.5" fill="#111827" />
  <circle cx="39.5" cy="42.5" r="0.9" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="62" cy="44" rx="9.5" ry="9.5" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" />
  <circle cx="59" cy="44" r="2.5" fill="#111827" />
  <circle cx="57.5" cy="42.5" r="0.9" fill="#FFFFFF" />

  <!-- Round Nose (Overlapping Eyes) -->
  <ellipse cx="50" cy="48" rx="5.5" ry="4.5" fill="#FED90F" stroke="#111827" stroke-width="2.5" />

  <!-- Chubby Baby Cheeks -->
  <circle cx="28" cy="60" r="4" fill="#F472B6" opacity="0.35" />
  <circle cx="72" cy="60" r="4" fill="#F472B6" opacity="0.35" />

  <!-- Red Pacifier (Mouth Shield & Handle Ring) -->
  <!-- Pacifier Outer Shield Base -->
  <ellipse cx="50" cy="65" rx="14" ry="10" fill="#EF4444" stroke="#111827" stroke-width="2.5" />
  <!-- Pacifier Center Knob -->
  <circle cx="50" cy="65" r="5.5" fill="#DC2626" stroke="#111827" stroke-width="2" />
  <!-- Pacifier Ring Handle -->
  <path d="M 44 68 Q 50 78 56 68" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round" />
</svg>
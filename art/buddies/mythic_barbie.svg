<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ears & Hot Pink Hoop Earrings -->
  <!-- Left Ear -->
  <ellipse cx="20" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <ellipse cx="18" cy="62" rx="2.5" ry="4.5" fill="none" stroke="#EC4899" stroke-width="2" />

  <!-- Right Ear -->
  <ellipse cx="80" cy="54" rx="4.5" ry="6.5" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5" />
  <ellipse cx="82" cy="62" rx="2.5" ry="4.5" fill="none" stroke="#EC4899" stroke-width="2" />

  <!-- High Glam Ponytail / Back Hair Volume -->
  <path d="
    M 20 44 
    C 10 24 16 8 36 6 
    C 44 4 56 4 64 6 
    C 84 8 90 24 80 44 
    C 90 58 88 78 82 86 
    L 18 86 
    C 12 78 10 58 20 44 
    Z" fill="#FDE047" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Ponytail Top Knot / Wrap -->
  <ellipse cx="50" cy="9" rx="11" ry="6.5" fill="#FACC15" stroke="#1E293B" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Hot Pink Hair Tie / Scrunchie -->
  <path d="M 42 13 Q 50 16 58 13 L 57 16 Q 50 19 43 16 Z" fill="#EC4899" stroke="#BE185D" stroke-width="1.2" />

  <!-- Main Head Squircle Base (Fair Warm Tan Glow) -->
  <rect x="22" y="24" width="56" height="58" rx="20" fill="#FED7AA" stroke="#1E293B" stroke-width="3.5" />

  <!-- Sweeping Platinum-Blonde Bangs / Front Fringe -->
  <path d="
    M 21 34 
    Q 30 38 38 26 
    Q 46 42 54 28 
    Q 62 40 70 26 
    Q 75 36 79 32 
    L 79 24 
    Q 50 12 21 24 
    Z" fill="#FDE047" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Hair Gloss Highlights -->
  <path d="M 33 13 Q 38 22 34 27" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />
  <path d="M 63 13 Q 59 22 64 27" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" />

  <!-- Perfectly Arched Golden-Brown Eyebrows -->
  <path d="M 28 38 Q 36 31 44 36" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 56 36 Q 64 31 72 38" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" />

  <!-- Soft Pink Eyeshadow -->
  <ellipse cx="37" cy="45" rx="9" ry="5.5" fill="#F472B6" opacity="0.4" />
  <ellipse cx="63" cy="45" rx="9" ry="5.5" fill="#F472B6" opacity="0.4" />

  <!-- Glam Eyeliner & Winged Lashes -->
  <!-- Left Eye Lashes -->
  <path d="M 28 43 Q 37 38 45 43" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" />
  <line x1="28" y1="43" x2="24" y2="39" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="40" x2="29" y2="36" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Right Eye Lashes -->
  <path d="M 55 43 Q 63 38 72 43" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" />
  <line x1="72" y1="43" x2="76" y2="39" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
  <line x1="68" y1="40" x2="71" y2="36" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />

  <!-- Big Sparkling Cobalt Blue Eyes -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="47" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="38" cy="47" r="4.4" fill="#0284C7" />
  <circle cx="38.5" cy="47" r="2.2" fill="#0F172A" />
  <circle cx="36.6" cy="44.8" r="1.2" fill="#FFFFFF" />
  <circle cx="39.8" cy="48.5" r="0.7" fill="#38BDF8" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="47" rx="8.5" ry="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2" />
  <circle cx="62" cy="47" r="4.4" fill="#0284C7" />
  <circle cx="61.5" cy="47" r="2.2" fill="#0F172A" />
  <circle cx="59.6" cy="44.8" r="1.2" fill="#FFFFFF" />
  <circle cx="62.8" cy="48.5" r="0.7" fill="#38BDF8" />

  <!-- Dainty Button Nose -->
  <path d="M 48 55 Q 50 58 53 56" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" />

  <!-- Bright Pink Cheek Glow -->
  <circle cx="28" cy="57" r="4.5" fill="#FB7185" opacity="0.4" />
  <circle cx="72" cy="57" r="4.5" fill="#FB7185" opacity="0.4" />

  <!-- Signature Dazzling Magenta Pink Smile -->
  <path d="M 38 66 Q 50 74 62 66" fill="none" stroke="#DB2777" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 43 67 Q 50 71 57 67" fill="#FFFFFF" stroke="#DB2777" stroke-width="1" />

  <!-- Signature Barbie Pink Striped / Gingham Collar Base -->
  <g>
    <!-- Bodice Fold -->
    <path d="M 26 80 Q 50 86 74 80 L 74 88 Q 50 94 26 88 Z" fill="#EC4899" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />
    <!-- White Sweetheart Trim Line -->
    <path d="M 32 82 Q 41 86 50 83 Q 59 86 68 82" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
    <!-- Signature Sparkle Star Pin -->
    <polygon points="50,84 51,82 52,84 54,85 52,86 51,88 50,86 48,85" fill="#FDE047" />
  </g>
</svg>